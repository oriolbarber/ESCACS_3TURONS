<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escacs 3 Turons</title>
<meta name="theme-color" content="#1F3F73">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231F3F73'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle' fill='white'%3E%E2%99%9E%3C/text%3E%3C/svg%3E">
<style>
/* ============ 1. TEMES I VARIABLES ============ */
:root{
  --navy:#1F3F73; --coral:#E74C3C; --gold:#F1C40F; --turq:#1ABC9C; --sky:#3498DB;
  --bg:#EEF2F8; --card:#FFFFFF; --ink:#13213A; --muted:#5A6A84; --line:#D6DFEB; --soft:#F5F8FC;
  --win:#1ABC9C; --loss:#E74C3C; --draw:#E0B000; --sel-ink:#fff;
  --silver:#AEB8C8; --bronze:#C9824A;
  --fs:17px; --r:14px;
}
:root[data-cb="1"]{ --win:#2E86DE; --loss:#E67E22; --draw:#8E8E8E; --turq:#2E86DE; --coral:#E67E22; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0C1628; --card:#15233C; --ink:#EAF1FB; --muted:#9FB2CE; --line:#273A5A; --soft:#1B2B47; }
}
:root[data-theme="dark"]{ --bg:#0C1628; --card:#15233C; --ink:#EAF1FB; --muted:#9FB2CE; --line:#273A5A; --soft:#1B2B47; }
:root[data-big="1"]{ --fs:20px; }

/* ============ 2. BASE ============ */
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.35;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.tt{text-transform:uppercase;letter-spacing:.02em}
.muted{color:var(--muted)}
.wrap{max-width:1150px;margin:0 auto;padding:0 16px}
.hidden{display:none!important}

/* ============ 3. CAPÇALERA ============ */
header.top{background:var(--navy);color:#fff;position:relative;overflow:hidden}
header.top .wrap{display:flex;align-items:center;gap:14px;min-height:92px;position:relative;z-index:2}
.brand{display:flex;align-items:center;gap:14px;flex:1;min-width:0}
.brand img{height:54px;width:auto}
.brand .knight{font-size:3rem;line-height:1}
.brand h1{margin:0;font-size:1.9rem;font-weight:800;letter-spacing:.06em}
.brand small{display:block;font-size:.72rem;color:#CFE0EE;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.diamonds{position:absolute;right:max(110px,calc((100vw - 1150px)/2 + 90px));top:50%;height:0;z-index:1;pointer-events:none}
.diamonds i{position:absolute;width:64px;height:64px;transform:rotate(45deg);opacity:.9;top:-32px}
.diamonds i:nth-child(1){background:var(--coral);right:0}
.diamonds i:nth-child(2){background:var(--gold);right:44px;top:-10px}
.diamonds i:nth-child(3){background:var(--turq);right:88px;top:-40px}
.diamonds i:nth-child(4){background:var(--sky);right:132px;top:-6px}
.adm{display:inline-block;margin-left:10px;vertical-align:middle;background:var(--gold);color:#3b2d00;font-size:.62rem;font-weight:800;letter-spacing:.06em;padding:4px 9px;border-radius:99px}
.sync{display:inline-block;margin-left:8px;font-size:.62rem;font-weight:800;letter-spacing:.06em;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.14);color:#fff;vertical-align:middle}
.sync.err{background:var(--coral)}
.pend{font-size:.85rem;color:var(--muted);font-weight:700}
.iconbtn{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:1.7rem;color:#fff;background:rgba(255,255,255,.12)}
.iconbtn:active{background:rgba(255,255,255,.25)}
nav.tabs{background:var(--navy);border-top:1px solid rgba(255,255,255,.12)}
nav.tabs .wrap{display:flex;gap:4px}
nav.tabs button{color:#CFE0EE;padding:14px 18px;font-weight:700;letter-spacing:.06em;border-bottom:4px solid transparent;min-height:52px}
nav.tabs button.on{color:#fff;border-color:var(--gold)}
@media (max-width:620px){
  .diamonds{display:none}
  .brand h1{font-size:1.45rem}
  .brand .knight{font-size:2.3rem}
}

/* ============ 4. COMPONENTS ============ */
main{padding:20px 0 90px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h2.sec{font-size:1.35rem;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.btn{min-height:50px;padding:0 20px;border-radius:12px;font-weight:700;background:var(--soft);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
:root[data-theme="dark"] .btn.pri{background:var(--sky);border-color:var(--sky)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{background:var(--sky);border-color:var(--sky)}}
.btn.ok{background:var(--turq);color:#fff;border-color:var(--turq)}
.btn.warn{background:var(--coral);color:#fff;border-color:var(--coral)}
.btn.sm{min-height:42px;padding:0 14px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:.8rem;font-weight:700;background:var(--soft);border:1px solid var(--line)}
.chip.ins{background:color-mix(in srgb,var(--sky) 18%,transparent);border-color:var(--sky)}
.chip.joc{background:color-mix(in srgb,var(--gold) 25%,transparent);border-color:var(--gold)}
.chip.fi{background:color-mix(in srgb,var(--turq) 18%,transparent);border-color:var(--turq)}
.dia{width:22px;height:22px;transform:rotate(45deg);border-radius:3px;flex:none;display:inline-grid;place-items:center}
.dia b{transform:rotate(-45deg);color:#fff;font-size:.72rem}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;min-height:50px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--soft)}
textarea{min-height:130px;resize:vertical}
label.f{display:block;font-weight:700;margin:12px 0 6px;font-size:.92rem}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{min-height:42px;padding:0 14px;border-radius:9px;font-weight:700;font-size:.9rem}
.seg button.on{background:var(--navy);color:#fff}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty .big{font-size:3rem}

/* Targetes de torneig */
.tcard{cursor:pointer;display:flex;flex-direction:column;gap:10px;border-left:6px solid var(--sky);transition:transform .1s}
.tcard:active{transform:scale(.99)}
.tcard.joc{border-left-color:var(--gold)}
.tcard.fi{border-left-color:var(--turq)}
.tcard h3{margin:0;font-size:1.12rem}
.tcard .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.9rem}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
details.more summary{cursor:pointer;font-weight:700;padding:14px 0;color:var(--muted);list-style:none}
details.more summary::before{content:"▸ "}
details.more[open] summary::before{content:"▾ "}

/* Torneig */
.thead{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.back{min-height:46px;padding:0 12px 0 6px;border-radius:10px;font-weight:700;color:var(--muted)}
.thead h2{margin:0;font-size:1.5rem;flex:1;min-width:200px}
.subtabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin:6px 0 16px;overflow-x:auto}
.subtabs button{padding:12px 16px;font-weight:700;color:var(--muted);border-bottom:4px solid transparent;margin-bottom:-2px;white-space:nowrap;min-height:50px}
.subtabs button.on{color:var(--ink);border-color:var(--coral)}

/* Rondes i partides */
.rounds{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.rounds button{min-width:52px;height:52px;border-radius:12px;font-weight:800;background:var(--card);border:2px solid var(--line);flex:none}
.rounds button.done{border-color:var(--turq)}
.rounds button.done::after{content:" ✓";font-size:.75rem}
.rounds button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.game{display:flex;flex-direction:column;gap:12px}
.game .tbl{font-size:.75rem;font-weight:800;color:var(--muted);letter-spacing:.08em}
.pl{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.pl .pc{font-size:1.6rem;line-height:1;width:28px;text-align:center}
.pl .nm{font-weight:700;font-size:1.05rem;overflow:hidden;text-overflow:ellipsis}
.pl .nm small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.pl .mk{font-weight:800;font-size:.9rem;min-width:26px;text-align:right}
.pl.w .nm{color:var(--win)} .pl.l .nm{opacity:.6}
.res{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.res button{min-height:52px;border-radius:12px;font-weight:800;font-size:1.05rem;background:var(--soft);border:2px solid var(--line)}
.res button.on.v1{background:var(--win);border-color:var(--win);color:#fff}
.res button.on.vd{background:var(--draw);border-color:var(--draw);color:#fff}
.res button.on.v0{background:var(--win);border-color:var(--win);color:#fff}
.res button:disabled{cursor:default}
.bye{display:flex;align-items:center;gap:12px;border-style:dashed}

/* Classificació */
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:end;max-width:640px;margin:0 auto 20px}
.pod{text-align:center}
.pod .nm{font-weight:800;margin-bottom:8px;font-size:1rem;overflow-wrap:anywhere}
.pod .pts{font-size:.85rem;color:var(--muted);margin-bottom:6px}
.pod .blk{border-radius:12px 12px 0 0;color:#fff;font-size:2.2rem;font-weight:800;display:grid;place-items:center}
.pod.p1 .blk{background:var(--gold);height:130px;color:#5a4500}
.pod.p2 .blk{background:var(--silver);height:96px}
.pod.p3 .blk{background:var(--bronze);height:72px}
table.st{width:100%;border-collapse:collapse}
table.st th{text-align:left;font-size:.75rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;padding:8px 8px;border-bottom:2px solid var(--line)}
table.st td{padding:12px 8px;border-bottom:1px solid var(--line)}
table.st td.n{text-align:right;font-variant-numeric:tabular-nums}
table.st td.pts{font-size:1.25rem;font-weight:800}
table.st tr.out td{opacity:.5}
.pos{font-weight:800;font-size:1.1rem;width:44px}

/* Persones */
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);min-height:58px}
.prow .nm{flex:1;min-width:0;font-weight:700}
.prow .nm small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.badge{font-size:.72rem;font-weight:800;padding:3px 9px;border-radius:99px;letter-spacing:.05em;color:#fff;flex:none}
.badge.prof{background:var(--navy)} .badge.alum{background:var(--coral)}
:root[data-theme="dark"] .badge.prof{background:var(--sky)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge.prof{background:var(--sky)}}
.addbtn{width:48px;height:48px;border-radius:12px;font-size:1.5rem;font-weight:800;background:var(--turq);color:#fff;flex:none}
.rmbtn{width:48px;height:48px;border-radius:12px;font-size:1.3rem;background:var(--soft);border:1px solid var(--line);flex:none}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.cols{grid-template-columns:1fr}}

/* ============ 5. MODALS, MENÚ, TOAST ============ */
.scrim{position:fixed;inset:0;background:rgba(5,12,25,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.scrim{align-items:center}}
.modal{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px 26px}
@media (min-width:700px){.modal{border-radius:20px}}
.modal h3{margin:0 0 6px;font-size:1.25rem}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:hidden}
.page{position:absolute;inset:0;background:var(--bg);overflow:auto;transition:transform .25s ease}
.page.in{transform:translateX(100%)}
.pbar{position:sticky;top:0;background:var(--navy);color:#fff;display:grid;grid-template-columns:56px 1fr 56px;align-items:center;min-height:64px;z-index:2}
.pbar h3{margin:0;text-align:center;font-size:1.1rem}
.pbar button{color:#fff;font-size:1.8rem;height:56px}
.mitem{display:flex;align-items:center;gap:14px;padding:18px 18px;border-bottom:1px solid var(--line);background:var(--card);width:100%;text-align:left;font-weight:700;min-height:64px}
.mitem small{display:block;font-weight:400;color:var(--muted)}
.mitem .dia{width:18px;height:18px}
.mitem::after{content:"›";margin-left:auto;font-size:1.6rem;color:var(--muted)}
.pbody{padding:18px 16px;max-width:700px;margin:0 auto}
.pbody p{margin:.4em 0 1em}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(200%);visibility:hidden;background:var(--navy);color:#fff;padding:14px 22px;border-radius:14px;font-weight:700;z-index:90;transition:transform .25s;max-width:92vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.on{transform:translateX(-50%) translateY(0);visibility:visible}

/* Lliscador de confirmació */
.slide{position:relative;height:60px;border-radius:99px;background:color-mix(in srgb,var(--coral) 16%,var(--soft));border:2px solid var(--coral);margin-top:18px;user-select:none;touch-action:none;overflow:hidden}
.slide span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;color:var(--coral);letter-spacing:.04em;padding-left:50px}
.slide .knob{position:absolute;left:4px;top:4px;width:48px;height:48px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font-size:1.4rem;cursor:grab;touch-action:none}

/* ============ 6. PROJECCIÓ I INSCRIPCIÓ ============ */
.fs{position:fixed;inset:0;z-index:80;background:var(--navy);color:#fff;overflow:auto;padding:24px 4vw}
.fs h2{font-size:clamp(1.6rem,4vw,3rem);margin:0}
.fs .fsbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
.fs .fsbar .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}
.fs .fsbar .btn.on{background:var(--gold);color:#3b2d00;border-color:var(--gold)}
.fsg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(520px,100%),1fr));gap:14px}
.fsgame{background:rgba(255,255,255,.08);border-radius:16px;padding:16px 20px;display:grid;grid-template-columns:auto 1fr auto 1fr;gap:14px;align-items:center;font-size:clamp(1.1rem,2.2vw,1.7rem);font-weight:700}
.fsgame .t{background:var(--gold);color:#3b2d00;border-radius:10px;padding:4px 12px;font-size:.8em}
.fsgame .vs{color:var(--gold);font-size:.85em}
.fs table.st td,.fs table.st th{border-color:rgba(255,255,255,.18);color:#fff;font-size:clamp(1rem,2vw,1.6rem)}
.kiosk{max-width:620px;margin:6vh auto 0;text-align:center}
.kiosk input{font-size:1.4rem;min-height:64px;text-align:center;background:#fff;color:#13213A}
.kiosk .btn{min-height:66px;font-size:1.3rem;width:100%;margin-top:14px}
.kiosk .okmsg{font-size:1.6rem;font-weight:800;color:var(--gold);min-height:2.2em;margin-top:18px}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <!-- Si poses logo.png (versió blanca) al repositori, apareix aquí automàticament -->
      <img src="logo.png" alt="Institut Els 3 Turons" onerror="this.remove();document.getElementById('kn').classList.remove('hidden')">
      <span id="kn" class="knight hidden">♞</span>
      <div style="min-width:0">
        <h1 class="tt">Escacs<span id="admBadge" class="adm hidden">ORGANITZACIÓ</span></h1>
        <small class="tt">Institut Els 3 Turons · Arenys de Mar<span id="sync" class="sync hidden"></span></small>
      </div>
    </div>
    <button class="iconbtn" data-act="menu" aria-label="Menú">⋮</button>
  </div>
  <div class="diamonds"><i></i><i></i><i></i><i></i></div>
</header>
<nav class="tabs"><div class="wrap">
  <button class="tt" data-act="go" data-v="home" id="tab-home">Tornejos</button>
  <button class="tt" data-act="go" data-v="people" id="tab-people">Persones</button>
</div></nav>

<main><div class="wrap" id="app"></div></main>
<div class="toast" id="toast"></div>
<div id="layer"></div>

<script>
/* =========================================================
   ESCACS 3 TURONS — gestor de tornejos (un sol fitxer)
   Dades: localStorage + exportar/importar JSON + dades.json publicat
   ========================================================= */

/* ---------- 1. DADES INICIALS ---------- */
const KEY = 'escacs3t_v1';          // dades de treball de l'organització (només aquest navegador)
const PREF_KEY = 'escacs3t_prefs';   // aspecte (de cada dispositiu)
const ADM_KEY = 'escacs3t_admin';    // '1' si aquest dispositiu està en mode organització
const PIN_KEY = 'escacs3t_pin';      // PIN del mode organització (connexió amb Google Sheets)
const API_KEY = 'escacs3t_api';      // URL de l'script desat en aquest dispositiu (opcional)

/* URL de l'aplicació web d'Apps Script (acaba en /exec). Si és buit, la web funciona
   en mode local (navegador + dades.json). Vegeu apps-script.gs per configurar-ho. */
const API_URL = '';
const POLL_MS = 20000;               // cada quant es comproven canvis d'altres persones
const PROFESSORAT = ['David Filgaira','Roc Biosca','Manel Jimenez','Oriol Barber','Oriol Berengueres',
  'Alicia Martin','Victor Aguilar','Tomas Martinez','Brian David Saimur','Alberto Bernabeu'];

function seed(){
  const players = PROFESSORAT.map(n => ({id:uid(), name:n, type:'prof', group:'Professorat'}));
  return {
    v:1, players,
    tournaments:[{
      id:uid(), name:'Torneig del professorat 2026-27', format:'lliga', nRounds:0,
      status:'inscripcio', playerIds:players.map(p=>p.id), out:[], rounds:[], date:today()
    }],
  };
}

/* ---------- 2. UTILITATS ---------- */
function uid(){ return Math.random().toString(36).slice(2,10); }
function today(){ return new Date().toISOString().slice(0,10); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function fmt(n){ return Number.isInteger(n) ? String(n) : (Math.floor(n)||'') + '½'; }
function norm(s){ return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
const $ = s => document.querySelector(s);

let S = null;
let PR = {theme:'auto', cb:false, big:false};
let admin = false;
const ui = { view:'home', tid:null, sub:null, round:0, q:'', filt:'tots', pq:'', pfilt:'tots' };

function save(){ if(!admin) return; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('⚠️ No s\'ha pogut desar al navegador'); }
  if(remote()){ pendingOps.push(curAct); push(); } }
function savePrefs(){ try{ localStorage.setItem(PREF_KEY, JSON.stringify(PR)); }catch(e){} }
async function fetchPub(){ try{ const r=await fetch('dades.json?'+Date.now(),{cache:'no-store'}); if(!r.ok) return null; return sanitize(await r.json()); }catch(e){ return null; } }
function pinHash(s){ let x=5381; for(const c of 'escacs3t:'+s) x=((x<<5)+x+c.charCodeAt(0))|0; return (x>>>0).toString(36); }
/* ---------- 2b. GOOGLE SHEETS (dades compartides) ---------- */
let VER = 0, pushing = false, dirty = false, pendingOps = [], curAct = null, online = true;
function api(){ try{ return localStorage.getItem(API_KEY) || API_URL; }catch(e){ return API_URL; } }
function remote(){ return !!api(); }
function getPin(){ try{ return localStorage.getItem(PIN_KEY)||''; }catch(e){ return ''; } }
async function apiGet(url){ const r = await fetch((url||api())+'?t='+Date.now(), {cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
async function apiPost(body, url){ const r = await fetch(url||api(), {method:'POST', body:JSON.stringify(body)}); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
function setSync(st){
  const el=$('#sync'); if(!el) return;
  if(!remote()){ el.classList.add('hidden'); return; }
  const txt = {ok: admin?'● DESAT':'● EN DIRECTE', saving:'⟳ DESANT…', off:'⚠ SENSE CONNEXIÓ', conflict:'⟳ COMBINANT…'}[st]||'';
  el.textContent=txt; el.classList.toggle('hidden', !txt); el.classList.toggle('err', st==='off');
}
function strip(d){ const c=JSON.parse(JSON.stringify(d)); delete c.pin; return c; }
const REPLAYABLE = new Set(['res','enrol','unenrol','withdraw']);
async function push(){
  if(pushing){ dirty=true; return; }
  pushing=true; dirty=false; setSync('saving');
  const ops = pendingOps; pendingOps = [];
  try{
    const r = await apiPost({action:'save', pin:getPin(), base:VER, data:strip(S)});
    online=true;
    if(r.ok){ VER=r.ver; setSync('ok'); }
    else if(r.conflict){
      // Algú altre ha desat abans: agafem la seva versió i hi tornem a aplicar els nostres canvis
      setSync('conflict'); S=sanitize(r.data||seed()); VER=r.ver;
      let lost=false;
      ops.forEach(op=>{ if(op && REPLAYABLE.has(op.act)){ const prev=curAct; curAct=op; try{ A[op.act](op.d); }catch(e){ lost=true; } curAct=prev; } else lost=true; });
      if(!ops.some(op=>op&&REPLAYABLE.has(op.act))) render();
      if(lost) toast('Una altra persona havia fet canvis. S\'han carregat: revisa i torna a fer l\'últim canvi.');
      else if(!pendingOps.length) setSync('ok');
    }
    else if(r.error==='pin'){ admin=false; try{localStorage.removeItem(ADM_KEY);localStorage.removeItem(PIN_KEY);}catch(e){} applyPrefs(); render(); toast('El PIN ha canviat. Torna a entrar al mode organització.'); }
    else toast('Error en desar: '+(r.error||'desconegut'));
  }catch(e){ online=false; setSync('off'); pendingOps = ops.concat(pendingOps); dirty=true; setTimeout(()=>{ if(dirty && !pushing) push(); }, 10000); pushing=false; return; }
  pushing=false;
  if(dirty || pendingOps.length) push();
}
async function poll(){
  if(!remote() || pushing || dirty || pendingOps.length || document.visibilityState!=='visible') return;
  if(document.querySelector('#layer .scrim, #layer .sheet')) return;      // hi ha un formulari obert
  const a=document.activeElement; if(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  try{ const r=await apiGet(); online=true; setSync('ok');
    if(r.data && r.ver>VER && !pushing && !dirty){ S=sanitize(r.data); VER=r.ver; if(admin) try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
      if(!$('#layer').children.length) render(); else if(window._fsRedraw) window._fsRedraw(); }
  }catch(e){ online=false; setSync('off'); }
}

function sanitize(d){
  if(!d || !Array.isArray(d.players) || !Array.isArray(d.tournaments)) throw new Error('Format no vàlid');

/* ---------- 3. PUNTUACIÓ I DESEMPATS ---------- */
const BYE_PTS = t => t.format==='suis' ? 1 : 0;   // suís: descans = 1 punt; lliga: 0 (tothom en té un)

function standings(t){
  const ids = [...new Set([...t.playerIds, ...t.rounds.flat().flatMap(g=>[g.w,g.b]).filter(Boolean)])];
  const R = {}; ids.forEach(id=>R[id]={id, pts:0, wins:0, played:0, games:[]});
  t.rounds.forEach(r=>r.forEach(g=>{
    if(g.b==null){ if(g.res==='bye' && R[g.w]) R[g.w].pts += BYE_PTS(t); return; }
    if(!g.res) return;
    const [a,b] = g.res==='1-0'?[1,0]:g.res==='0-1'?[0,1]:[.5,.5];
    R[g.w].pts+=a; R[g.b].pts+=b; R[g.w].played++; R[g.b].played++;
    if(a===1)R[g.w].wins++; if(b===1)R[g.b].wins++;
    R[g.w].games.push([g.b,a]); R[g.b].games.push([g.w,b]);
  }));
  Object.values(R).forEach(x=>{
    x.buch = x.games.reduce((s,[o])=>s+R[o].pts,0);
    x.sb   = x.games.reduce((s,[o,sc])=>s+sc*R[o].pts,0);
    x.tb   = t.format==='suis' ? x.buch : x.sb;
  });
  return Object.values(R).sort((a,b)=> b.pts-a.pts || b.tb-a.tb || b.wins-a.wins || P(a.id).name.localeCompare(P(b.id).name));
}

/* ---------- 4. APARELLAMENTS ---------- */
// Lliga (tothom contra tothom): mètode del cercle, totes les rondes de cop
function roundRobin(ids){
  let a = shuffle(ids.slice()); if(a.length%2) a.push(null);
  const n=a.length, rounds=[];
  for(let r=0;r<n-1;r++){
    const games=[], byes=[];
    for(let i=0;i<n/2;i++){
      let x=a[i], y=a[n-1-i];
      if((r+i)%2) [x,y]=[y,x];
      if(x==null || y==null) byes.push({w:x??y, b:null, res:'bye'});
      else games.push({w:x, b:y, res:null});
    }
    rounds.push(games.concat(byes));
    a = [a[0], a[n-1], ...a.slice(1,n-1)];
  }
  return rounds;
}

// Suís: aparella per punts evitant repetir rivals
function swissRound(t){
  const st = standings(t).filter(x=>t.playerIds.includes(x.id) && !t.out.includes(x.id));
  let list = st.map(x=>x.id);
  if(t.rounds.length===0) shuffle(list);
  const played = new Set(), hadBye = new Set(), whites={}, last={};
  t.rounds.forEach(r=>r.forEach(g=>{
    if(g.b==null){ hadBye.add(g.w); return; }
    played.add(g.w+'|'+g.b); played.add(g.b+'|'+g.w);
    whites[g.w]=(whites[g.w]||0)+1; last[g.w]='w'; last[g.b]='b';
  }));
  let bye=null;
  if(list.length%2){
    for(let i=list.length-1;i>=0;i--) if(!hadBye.has(list[i])){ bye=list[i]; break; }
    if(bye==null) bye=list[list.length-1];
    list = list.filter(x=>x!==bye);
  }
  let steps=0;
  const rec = (arr, allowRe) => {
    if(!arr.length) return [];
    if(++steps>40000) return null;
    const a=arr[0];
    for(let j=1;j<arr.length;j++){
      const b=arr[j];
      if(!allowRe && played.has(a+'|'+b)) continue;
      const r = rec(arr.filter((_,k)=>k!==0&&k!==j), allowRe);
      if(r) return [[a,b],...r];
    }
    return null;
  };
  let pairs = rec(list,false); if(!pairs){ steps=0; pairs = rec(list,true); }
  const games = pairs.map(([a,b])=>{
    const wa=whites[a]||0, wb=whites[b]||0;
    let swap = wa>wb || (wa===wb && last[a]==='w' && last[b]!=='w');
    return swap ? {w:b,b:a,res:null} : {w:a,b:b,res:null};
  });
  if(bye) games.push({w:bye,b:null,res:'bye'});
  return games;
}
function suggestRounds(n){ return Math.max(3, Math.min(9, Math.ceil(Math.log2(Math.max(2,n)))+2)); }
function roundDone(r){ return r.every(g=>g.b==null || g.res); }
function totalRounds(t){ return t.format==='lliga' ? t.rounds.length : t.nRounds; }

  return `<span class="chip fi">✓ Acabat</span>`;
}

function vRounds(t){
  if(t.status==='inscripcio') return `<div class="card empty"><div class="big">♟</div><p>${admin?'Quan la llista de jugadors estigui a punt, prem <b>Començar</b> i es generaran els aparellaments.':'El torneig encara no ha començat. Consulta qui hi està inscrit a <b>Jugadors</b>.'}</p></div>`;
  if(ui.round>=t.rounds.length) ui.round = Math.max(0, t.rounds.length-1);
  const ri = ui.round, r = t.rounds[ri], lock = t.status==='acabat' || !admin;
  const chips = t.rounds.map((x,i)=>`<button class="${i===ri?'on':''} ${roundDone(x)?'done':''}" data-act="round" data-v="${i}">${i+1}</button>`).join('')
    + (t.format==='suis' ? Array.from({length:Math.max(0,t.nRounds-t.rounds.length)},(_,i)=>`<button disabled style="opacity:.35">${t.rounds.length+i+1}</button>`).join('') : '');
  const real = r.filter(g=>g.b!=null), done = real.filter(g=>g.res).length;
  let n=0;
  const games = r.map((g,gi)=>{
    if(g.b==null) return `<div class="card bye"><span class="dia" style="background:var(--sky)"><b>–</b></span><div><b>${esc(P(g.w).name)}</b><div class="muted" style="font-size:.88rem">Descansa aquesta ronda ${BYE_PTS(t)?'(+1 punt)':'(0 punts)'}</div></div></div>`;
    n++;
    const wW = g.res==='1-0', bW = g.res==='0-1', dr = g.res==='½-½';
    const pl = (id,pc,win,lose,mk) => `<div class="pl ${win?'w':''} ${lose?'l':''}"><span class="pc">${pc}</span><span class="nm">${esc(P(id).name)}<small>${esc(P(id).group||'')}</small></span><span class="mk">${mk}</span></div>`;
    const b = (v,lab,cls) => `<button class="${cls} ${g.res===v?'on':''}" data-act="res" data-g="${gi}" data-v="${v}" ${lock?'disabled':''} aria-label="Resultat ${lab}">${lab}</button>`;
    return `<div class="card game">
      <div class="tbl tt">Taula ${n}</div>
      ${pl(g.w,'♔',wW,bW, wW?'✓ 1':bW?'0':dr?'½':'')}
      ${pl(g.b,'♚',bW,wW, bW?'✓ 1':wW?'0':dr?'½':'')}
      ${admin ? `<div class="res">${b('1-0','1 – 0','v1')}${b('½-½','½ – ½','vd')}${b('0-1','0 – 1','v0')}</div>` : (g.res?'':'<div class="pend">⏳ Pendent de jugar</div>')}
    </div>`;
  }).join('');
  let next='';
  if(admin && t.status==='enjoc' && t.format==='suis' && roundDone(r) && ri===t.rounds.length-1 && t.rounds.length<t.nRounds)
    next = `<div class="card" style="margin-top:14px;text-align:center"><p style="margin-top:0">Ronda ${ri+1} completa.</p><button class="btn pri" data-act="nextRound">Generar ronda ${ri+2}</button></div>`;
  return `<div class="rounds">${chips}</div>
    <div class="spread" style="margin-bottom:10px"><b class="tt">Ronda ${ri+1}</b><span class="muted">${done}/${real.length} resultats</span></div>
    <div class="games">${games}</div>${next}`;
}

// Confirmació lliscant per a accions destructives
function slideConfirm(title, msg, label, onOk){
  const d = modal(`<h3 class="tt">${esc(title)}</h3><p class="muted">${msg}</p>
    <div class="slide"><span class="tt">${esc(label)}</span><div class="knob">›</div></div>
    <div class="acts"><button class="btn" data-x>Cancel·lar</button></div>`, d=>{
      d.querySelector('[data-x]').onclick=()=>d.remove();
      const tr=d.querySelector('.slide'), k=d.querySelector('.knob'); let x0=null, max=0, x=0;
      k.addEventListener('pointerdown',e=>{ x0=e.clientX-x; max=tr.clientWidth-k.offsetWidth-8; k.setPointerCapture(e.pointerId); k.style.transition='none'; });
      k.addEventListener('pointermove',e=>{ if(x0==null) return; x=Math.max(0,Math.min(max,e.clientX-x0)); k.style.transform=`translateX(${x}px)`; });
      const up=()=>{ if(x0==null) return; x0=null; if(x>=max*0.92){ d.remove(); onOk(); } else { x=0; k.style.transition='transform .2s'; k.style.transform='translateX(0)'; } };
      k.addEventListener('pointerup',up); k.addEventListener('pointercancel',up);
  });
}

let fsMode='ron';
function project(){
  const tid=ui.tid; if(!T(tid)) return;
  const L=$('#layer'); const d=document.createElement('div'); d.className='fs'; L.appendChild(d);
  const draw=()=>{ const t=T(tid); if(!t){ d.remove(); return; }
    const ri = Math.min(ui.round, t.rounds.length-1), r=t.rounds[ri]||[];
    let n=0, body='';
    if(fsMode==='ron') body = `<div class="fsg">${r.map(g=>{ if(g.b==null) return `<div class="fsgame"><span class="t">–</span><span style="grid-column:2/5">${esc(P(g.w).name)} <span class="vs">descansa</span></span></div>`; n++;
      const rs = g.res ? g.res.replace('-',' – ') : 'vs';
      return `<div class="fsgame"><span class="t">${n}</span><span>♔ ${esc(P(g.w).name)}</span><span class="vs">${rs}</span><span>♚ ${esc(P(g.b).name)}</span></div>`; }).join('')}</div>`;
    else { const st=standings(t); body = `<table class="st"><thead><tr><th>#</th><th>Jugador/a</th><th style="text-align:right">Punts</th></tr></thead><tbody>${st.map((x,i)=>`<tr><td class="pos">${i+1}</td><td><b>${esc(P(x.id).name)}</b></td><td class="n pts">${fmt(x.pts)}</td></tr>`).join('')}</tbody></table>`; }
    d.innerHTML = `<div class="fsbar"><h2 class="tt" style="flex:1">${esc(t.name)} ${fsMode==='ron'?'· Ronda '+(ri+1):''}</h2>
      <button class="btn ${fsMode==='ron'?'on':''}" data-m="ron">Ronda</button><button class="btn ${fsMode==='cla'?'on':''}" data-m="cla">Classificació</button><button class="btn" data-m="x">✕ Sortir</button></div>${body}`;
    d.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ if(b.dataset.m==='x'){ try{document.exitFullscreen&&document.fullscreenElement&&document.exitFullscreen();}catch(e){} d.remove(); return; } fsMode=b.dataset.m; draw(); });
  };
  window._fsRedraw=()=>{ if(d.isConnected) draw(); else window._fsRedraw=null; };
  draw(); try{ d.requestFullscreen && d.requestFullscreen(); }catch(e){}
}
function kiosk(){
  const tid=ui.tid, t=T(tid); const L=$('#layer'); const d=document.createElement('div'); d.className='fs'; L.appendChild(d);
  d.innerHTML = `<div class="fsbar"><span style="flex:1"></span><button class="btn" data-x>✕ Sortir</button></div>
   <div class="kiosk"><div style="font-size:4rem">♞</div><h2 class="tt">Apunta't!</h2><p style="font-size:1.2rem;color:#CFE0EE">${esc(t.name)}</p>

   <p style="color:#CFE0EE">Inscrits: <b id="kC">${t.playerIds.length}</b></p></div>`;
  const go=()=>{ const t=T(tid); if(!t) return; const n=d.querySelector('#kN').value.trim(), g=d.querySelector('#kG').value.trim(); if(n.length<3){ d.querySelector('#kMsg').textContent='Escriu el nom complet'; return; }
    let p = S.players.find(x=>norm(x.name)===norm(n));
    if(!p){ p={id:uid(), name:n, type:'alum', group:g}; S.players.push(p); }
    if(t.playerIds.includes(p.id)){ d.querySelector('#kMsg').textContent=`${p.name}, ja hi eres!`; }
    else { t.playerIds.push(p.id); save(); d.querySelector('#kMsg').textContent=`✓ ${p.name}, ja estàs inscrit/a!`; }
    d.querySelector('#kC').textContent=t.playerIds.length; d.querySelector('#kN').value=''; d.querySelector('#kN').focus(); };
  d.querySelector('#kOk').onclick=go; d.querySelector('#kG').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
  d.querySelector('#kN').addEventListener('keydown',e=>{ if(e.key==='Enter') d.querySelector('#kG').focus(); });
  d.querySelector('[data-x]').onclick=()=>{ d.remove(); render(); };
  setTimeout(()=>d.querySelector('#kN').focus(),50);
}

      <p>${remote()?'Les dades són al full de Google. Una còpia en fitxer va bé per guardar l\'estat d\'un torneig acabat o per si de cas.':'Les dades es guarden <b>en aquest navegador</b>. Fes una còpia de tant en tant i sempre abans de canviar d\'ordinador.'}</p>
      <button class="btn pri" style="width:100%" data-e>⬇ Exportar còpia (.json)</button>
      <p style="margin-top:22px">Importar una còpia <b>substitueix</b> totes les dades actuals.</p>
      <input type="file" id="impF" accept=".json,application/json" class="hidden">
      <button class="btn" style="width:100%" data-i>⬆ Importar còpia</button></div>`);
    pg.querySelector('[data-e]').onclick=()=>download(backupName(), S);
    const f=pg.querySelector('#impF');
    pg.querySelector('[data-i]').onclick=()=>f.click();
    f.onchange=()=>{ const file=f.files[0]; if(!file) return; const rd=new FileReader();
      rd.onload=()=>{ let d; try{ d=sanitize(JSON.parse(rd.result)); }catch(e){ toast('El fitxer no és una còpia vàlida'); return; }
        slideConfirm('Importar còpia', `Es substituiran les dades actuals per les del fitxer (${d.tournaments.length} tornejos, ${d.players.length} persones).`, 'Llisca per importar', ()=>{ S=d; save(); ui.view='home'; sh.remove(); render(); toast('Còpia importada'); }); };
      rd.readAsText(file); f.value=''; };
  }
  function web(){
    const pg=page('Publicar al web', `<div class="pbody">
      <p>GitHub Pages és una web estàtica: no guarda res per si sola. Per publicar els resultats:</p>
      <p><b>1.</b> Descarrega <b>dades.json</b>.<br><b>2.</b> Puja'l al repositori, al costat d'<b>index.html</b> (substituint l'anterior).<br><b>3.</b> En un minut, qui obri la web veurà els tornejos actualitzats.</p>
      <button class="btn pri" style="width:100%" data-d>⬇ Descarregar dades.json</button>
      <p style="margin-top:22px">En un altre ordinador o mòbil, carrega aquí la darrera versió publicada:</p>
      <button class="btn" style="width:100%" data-l>⟳ Carregar dades publicades</button></div>`);
    pg.querySelector('[data-d]').onclick=()=>download('dades.json', S);
    pg.querySelector('[data-l]').onclick=async()=>{ const d=await fetchPub(); if(!d){ toast('No s\'ha trobat dades.json al web'); return; }
      slideConfirm('Carregar dades publicades', 'Les dades d\'aquest navegador se substituiran per les publicades.', 'Llisca per carregar', ()=>{ d.pin=d.pin||S.pin; S=d; save(); ui.view='home'; sh.remove(); render(); toast('Dades publicades carregades'); }); };
  }
  function del(){
    slideConfirm('Esborrar-ho tot', (remote()?'S\'esborraran tots els tornejos i persones <b>per a tothom</b> (full de Google).':'S\'esborraran tots els tornejos i persones d\'aquest navegador.')+' Es tornarà a carregar la llista inicial del professorat.', 'Llisca per esborrar', ()=>{ const pin=S.pin; S=seed(); S.pin=pin; save(); ui.view='home'; sh.remove(); render(); toast('Tot esborrat'); });
  }
  function about(){
    page('Com funciona', `<div class="pbody">
      <p><b>Suís:</b> cada ronda s'aparella gent amb punts semblants i sense repetir rival. Va bé per a grups grans (alumnat). Amb n jugadors, ⌈log₂ n⌉ + 1 o 2 rondes ja donen un guanyador clar.</p>
      <p><b>Lliga:</b> tothom contra tothom. Les rondes es generen totes de cop. Si són senars, cada ronda descansa algú (0 punts, i tothom descansa una vegada).</p>
      <p><b>Desempats:</b> Buchholz al suís (suma de punts dels rivals) i Sonneborn-Berger a la lliga.</p>
      <p><b>Colors:</b> el programa alterna blanques ♔ i negres ♚ per equilibrar.</p>
      ${remote()?'<p><b>Dades:</b> es guarden en un full de Google. Qui té el PIN pot posar resultats des de qualsevol dispositiu, i la resta ho veu en directe.</p>':''}
      <p style="${remote()?'display:none':''}"><b>Dades:</b> la vista pública mostra sempre la darrera versió publicada (<b>dades.json</b>). El mode organització treballa amb una còpia al navegador d'aquest dispositiu: fes còpies i publica <b>dades.json</b> perquè la resta ho vegi.</p>
      <p class="muted">Institut Els 3 Turons · Arenys de Mar</p></div>`);
  }
}
/* ---------- 8b. PIN DEL MODE ORGANITZACIÓ ---------- */
function enterAdmin(work){ S=work; admin=true; try{localStorage.setItem(ADM_KEY,'1');}catch(e){} save(); ui.view='home'; applyPrefs(); render(); }
function pinLogin(){
  if(remote()) return pinLoginRemote();
  const work = sanitizeSafe(load()) || S;   // la còpia de treball d'aquest dispositiu, si n'hi ha
  if(!work.pin){ pinSet(work); return; }
  modal(`<h3 class="tt">Mode organització</h3><p class="muted">Escriu el PIN per gestionar els tornejos.</p>
    <input type="password" id="pin1" inputmode="numeric" autocomplete="off" placeholder="PIN" style="font-size:1.4rem;text-align:center;letter-spacing:.3em">
    <div class="acts"><button class="btn" data-x>Cancel·lar</button><button class="btn pri" data-ok>Entrar</button></div>`, d=>{
    const go=()=>{ const v=d.querySelector('#pin1').value; if(pinHash(v)===work.pin){ d.remove(); enterAdmin(work); toast('Mode organització activat'); } else { d.querySelector('#pin1').value=''; toast('PIN incorrecte'); } };
    d.querySelector('[data-x]').onclick=()=>d.remove(); d.querySelector('[data-ok]').onclick=go;
    d.querySelector('#pin1').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
    setTimeout(()=>d.querySelector('#pin1').focus(),50);
  });
}
function pinLoginRemote(){
  modal(`<h3 class="tt">Mode organització</h3><p class="muted">Escriu el PIN per gestionar els tornejos.</p>
    <input type="password" id="pin1" inputmode="numeric" autocomplete="off" placeholder="PIN" style="font-size:1.4rem;text-align:center;letter-spacing:.3em">
    <div class="acts"><button class="btn" data-x>Cancel·lar</button><button class="btn pri" data-ok>Entrar</button></div>`, d=>{
    const ok=d.querySelector('[data-ok]');
    const go=async()=>{ const v=d.querySelector('#pin1').value; ok.disabled=true;
      try{ const r=await apiPost({action:'check', pin:v});
        if(r.ok){ try{localStorage.setItem(PIN_KEY,v);}catch(e){} d.remove(); admin=true; try{localStorage.setItem(ADM_KEY,'1');}catch(e){}
          ui.view='home'; applyPrefs(); setSync('ok'); render(); toast('Mode organització activat'); }
        else { d.querySelector('#pin1').value=''; toast('PIN incorrecte'); }
      }catch(e){ toast('Sense connexió amb el full de Google'); }
      ok.disabled=false; };
    d.querySelector('[data-x]').onclick=()=>d.remove(); ok.onclick=go;
    d.querySelector('#pin1').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
    setTimeout(()=>d.querySelector('#pin1').focus(),50);
  });
}
function pinSet(work){
  const first = !!work;
  modal(`<h3 class="tt">${first?'Crea un PIN':'Canviar el PIN'}</h3><p class="muted">${first?'Encara no hi ha PIN. Tria\'n un per entrar al mode organització (mínim 4 caràcters).':'Escriu el PIN nou dues vegades.'}</p>
    <input type="password" id="pa" inputmode="numeric" autocomplete="new-password" placeholder="PIN nou" style="font-size:1.3rem;text-align:center;letter-spacing:.3em">
    <input type="password" id="pb" inputmode="numeric" autocomplete="new-password" placeholder="Repeteix el PIN" style="font-size:1.3rem;text-align:center;letter-spacing:.3em;margin-top:10px">
    <div class="acts"><button class="btn" data-x>Cancel·lar</button><button class="btn pri" data-ok>Desar</button></div>`, d=>{
    d.querySelector('[data-x]').onclick=()=>d.remove();
    d.querySelector('[data-ok]').onclick=()=>{ const a=d.querySelector('#pa').value, b=d.querySelector('#pb').value;
      if(a.length<4) return toast('Mínim 4 caràcters'); if(a!==b) return toast('Els dos PIN no coincideixen');
      if(first){ work.pin=pinHash(a); d.remove(); enterAdmin(work); toast('PIN creat. Mode organització activat'); }
      else { S.pin=pinHash(a); save(); d.remove(); toast('PIN canviat. Recorda publicar dades.json'); } };
    setTimeout(()=>d.querySelector('#pa').focus(),50);
  });
}
function sanitizeSafe(d){ try{ return d ? sanitize(d) : null; }catch(e){ return null; } }

function backupName(){ const d=new Date(); const s=String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'); return `${s}_Escacs-3Turons.json`; }
function download(name, obj){ const b=new Blob([JSON.stringify(obj,null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); toast('Descarregat: '+name); }

/* ---------- 9. ACCIONS ---------- */
const A = {
  go:d=>{ ui.view=d.v; ui.sub=null; scrollTo(0,0); render(); },
  open:d=>{ ui.view='tour'; ui.tid=d.id; ui.sub=null; const t=T(d.id); const c=t.rounds.findIndex(r=>!roundDone(r)); ui.round = c<0 ? Math.max(0,t.rounds.length-1) : c; scrollTo(0,0); render(); },
  sub:d=>{ ui.sub=d.v; render(); },
  round:d=>{ ui.round=+d.v; render(); },
  newT:()=>tourModal(null),
  editT:()=>tourModal(T(ui.tid)),
  menu:()=>openMenu(),
  project:()=>project(),
  kiosk:()=>kiosk(),
  start:()=>{ const t=T(ui.tid); if(t.playerIds.length<2) return toast('Calen almenys 2 jugadors');
    if(t.format==='lliga'){ t.rounds = roundRobin(t.playerIds); }
    else { if(!t.nRounds) t.nRounds=suggestRounds(t.playerIds.length); t.rounds=[swissRound(t)]; }
    t.status='enjoc'; ui.sub='ron'; ui.round=0; save(); render(); toast('Torneig començat! Bona partida ♟'); },
  nextRound:()=>{ const t=T(ui.tid); t.rounds.push(swissRound(t)); ui.round=t.rounds.length-1; save(); render(); toast('Ronda '+t.rounds.length+' generada'); },
  res:d=>{ const t=T(d.tid||ui.tid); const ri = d.ri!==undefined ? +d.ri : ui.round; const g=t&&t.rounds[ri]&&t.rounds[ri][+d.g]; if(!g) return;
    if(d.set===undefined) d.set = g.res===d.v ? '' : d.v; d.tid=t.id; d.ri=ri; g.res = d.set||null; save(); render();
    if(ri===ui.round && roundDone(t.rounds[ri]) && g.res && !curAct?.replayed) toast('Ronda '+(ui.round+1)+' completa ✓'); },
  finish:()=>{ const t=T(ui.tid); t.status='acabat'; ui.sub='cla'; save(); render(); toast('🏆 Guanyador/a: '+P(standings(t)[0].id).name); },
  reopen:()=>{ const t=T(ui.tid); t.status='enjoc'; save(); render(); },
  enrol:d=>{ d.tid=d.tid||ui.tid; const t=T(d.tid); if(!t) return; if(!t.playerIds.includes(d.id)) t.playerIds.push(d.id); save(); render(); },
  unenrol:d=>{ d.tid=d.tid||ui.tid; const t=T(d.tid); if(!t) return; t.playerIds=t.playerIds.filter(x=>x!==d.id); save(); render(); },
  withdraw:d=>{ d.tid=d.tid||ui.tid; const t=T(d.tid); if(!t) return; if(d.set===undefined) d.set = t.out.includes(d.id)?'in':'out'; t.out = d.set==='in' ? t.out.filter(x=>x!==d.id) : [...t.out.filter(x=>x!==d.id), d.id]; save(); render(); },
  enrolAll:()=>{ const t=T(ui.tid); const l=pickerList(t); if(!l.length) return; l.forEach(p=>t.playerIds.push(p.id)); save(); render(); toast(l.length+' inscrits'); },
  filt:d=>{ ui.filt=d.v; render(); },
  pfilt:d=>{ ui.pfilt=d.v; render(); },
  quickAdd:()=>{ const t=T(ui.tid); const n=$('#qaName').value.trim(), g=$('#qaGroup').value.trim(); if(!n) return toast('Escriu un nom');
    let p=S.players.find(x=>norm(x.name)===norm(n)); if(!p){ p={id:uid(), name:n, type:'alum', group:g}; S.players.push(p); }
    if(!t.playerIds.includes(p.id)) t.playerIds.push(p.id); save(); render(); toast(p.name+' inscrit/a'); setTimeout(()=>{ const i=$('#qaName'); if(i) i.focus(); },30);
    const gi=$('#qaGroup'); if(gi) gi.value=g; },
  addPerson:()=>{ const n=$('#npName').value.trim(); if(!n) return toast('Escriu un nom');
    if(S.players.some(x=>norm(x.name)===norm(n))) return toast('Aquesta persona ja hi és');
    S.players.push({id:uid(), name:n, type:$('#npType').value, group:$('#npGroup').value.trim()}); save(); const keep=[$('#npType').value,$('#npGroup').value]; render();
    $('#npType').value=keep[0]; $('#npGroup').value=keep[1]; $('#npName').focus(); toast(n+' afegit/da'); },
  bulkAdd:()=>{ const def=$('#bulkGroup').value.trim(); let k=0, dup=0;
    $('#bulk').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{ const [n,g]=l.split(/[;\t]/).map(s=>s.trim());
      if(!n) return; if(S.players.some(x=>norm(x.name)===norm(n))){ dup++; return; }
      S.players.push({id:uid(), name:n, type:'alum', group:g||def}); k++; });
    save(); render(); toast(`${k} afegits`+(dup?` · ${dup} ja hi eren`:'')); },
  editP:d=>personModal(S.players.find(p=>p.id===d.id)),
};
const PUBLIC_ACTS = new Set(['go','open','sub','round','menu','project']);
document.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el || el.disabled) return; if(!admin && !PUBLIC_ACTS.has(el.dataset.act)) return; const f=A[el.dataset.act]; if(f){ e.preventDefault(); const d={...el.dataset}; curAct={act:el.dataset.act, d}; try{ f(d, el, e); } finally { curAct=null; } } });
document.addEventListener('input',e=>{
  if(e.target.id==='pq'){ ui.q=e.target.value; fillPicker(); }
  if(e.target.id==='ppq'){ ui.pq=e.target.value; fillPeople(); }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter' && (e.target.id==='qaName'||e.target.id==='qaGroup')) A.quickAdd();
  if(e.key==='Enter' && e.target.id==='npName') A.addPerson();
  if(e.key==='Escape'){ const L=$('#layer'); if(L.lastElementChild && L.lastElementChild.classList.contains('scrim')) closeTop(); }
});

/* ---------- 10. ARRENCADA ---------- */
(async function boot(){
  const raw = load();
  try{ const p = JSON.parse(localStorage.getItem(PREF_KEY)||'null') || (raw&&raw.prefs); if(p) PR=Object.assign(PR,p); }catch(e){}
  try{ admin = localStorage.getItem(ADM_KEY)==='1'; }catch(e){}
  applyPrefs(); render();          // pinta de seguida; les dades publicades arriben després
  if(remote()){
    try{
      const r = await apiGet(); VER = r.ver||0;
      if(r.data) S = sanitize(r.data);
      else { S = sanitizeSafe(raw) || await fetchPub() || seed(); if(admin && getPin()) save(); }   // full buit: s'hi pugen les dades
      if(admin) try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
      setSync('ok');
    }catch(e){ S = sanitizeSafe(raw) || await fetchPub() || seed(); setSync('off'); toast('Sense connexió: es mostren les darreres dades guardades'); }
    if(admin && !getPin()){ admin=false; try{localStorage.removeItem(ADM_KEY);}catch(e){} }
    setInterval(poll, POLL_MS);
    document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') poll(); });
  }
  else if(admin){ S = sanitizeSafe(raw) || await fetchPub() || seed(); save(); }
  else     { S = await fetchPub() || sanitizeSafe(raw) || seed(); }   // el públic veu sempre la versió publicada
  applyPrefs(); render();
})();
</script>
