<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escacs 3 Turons</title>
<meta name="theme-color" content="#1F3F73">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Escacs 3T">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231F3F73'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle' fill='white'%3E%E2%99%9E%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* ============ 1. TEMES I VARIABLES ============ */
/* Disseny: capçalera navy del logotip, groc = "actual", negre de tauler.
   Navegació inferior al mòbil (superior a l'ordinador). */
:root{
  --navy:#1F3F73; --head:#1F3F73; --head-adm:#13213A;
  --pri:#1F3F73; --pri-ink:#FFFFFF;
  --gold:#F1C40F; --gold-ink:#3B2D00;
  --board:#1B2233; --sq-l:#E9EDF3; --cta:#1B2233; --tnobg:#1B2233;
  --bg:#F4F6FA; --card:#FFFFFF; --ink:#13213A; --muted:#5B6B84; --line:#DCE3EE; --soft:#EEF2F7; --seg:#E4E9F1;
  --pendc:#B23A26; --okc:#1A8F6E; --ok-ink:#FFFFFF; --draw-bg:#C9D1DD; --draw-ink:#13213A;
  --coral:#C0392B; --sky:#3498DB; --turq:#1A8F6E;
  --m1:#F1C40F; --m1i:#3B2D00; --m2:#C9D1DD; --m2i:#13213A; --m3:#C98A55; --m3i:#2A1606;
  --fd:'Archivo',Arial,Helvetica,sans-serif; --fb:'Atkinson Hyperlegible',Arial,Helvetica,sans-serif;
  --fs:17px; --r:16px; --navh:66px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0C1628; --cta:#1F3F73; --tnobg:#2E4468; --card:#15233C; --ink:#EAF1FB; --muted:#9FB2CE; --line:#273A5A; --soft:#1B2B47; --seg:#1B2B47;
    --pri:#4A78C2; --pendc:#FF8A75; --okc:#3CCB9F; --ok-ink:#062018; --draw-bg:#3A4D6E; --draw-ink:#EAF1FB; --coral:#FF7A66; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#0C1628; --cta:#1F3F73; --tnobg:#2E4468; --card:#15233C; --ink:#EAF1FB; --muted:#9FB2CE; --line:#273A5A; --soft:#1B2B47; --seg:#1B2B47;
  --pri:#4A78C2; --pendc:#FF8A75; --okc:#3CCB9F; --ok-ink:#062018; --draw-bg:#3A4D6E; --draw-ink:#EAF1FB; --coral:#FF7A66; color-scheme:dark; }
:root[data-cb="1"]{ --okc:#2E86DE; --ok-ink:#FFFFFF; --pendc:#D35400; --turq:#2E86DE; }
:root[data-big="1"]{ --fs:20px; }

/* ============ 2. BASE ============ */
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{overflow-x:clip;margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);line-height:1.35;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tt{text-transform:uppercase;letter-spacing:.02em}
.muted{color:var(--muted)}
.small{font-size:.8rem}
.wrap{max-width:1150px;margin:0 auto;padding:0 16px}
.narrow{max-width:900px;margin:0 auto}
.hidden{display:none!important}
.ico{width:1.3em;height:1.3em;flex:none}

/* ============ 3. CAPÇALERA, FRANJA I NAVEGACIÓ ============ */
header.top{background:var(--head);color:#fff}
body.adm-mode header.top{background:var(--head-adm)}
.hrow{display:flex;align-items:center;gap:14px;min-height:76px}
.hrow .logo{height:46px;width:auto;flex:none}
.hrow .vr{width:1px;align-self:stretch;margin:14px 0;background:rgba(255,255,255,.3)}
.brandtxt{flex:1;min-width:0}
.brandtxt h1{margin:0;font-family:var(--fd);font-weight:800;font-size:1.45rem;letter-spacing:.06em;line-height:1.1}
.brandtxt small{display:block;font-size:.72rem;color:#CFE0EE;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adm{display:inline-block;background:var(--gold);color:var(--gold-ink);font-size:.6rem;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:99px;margin-bottom:3px}
.sync{display:inline-block;margin-left:8px;font-size:.6rem;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.14);color:#fff;vertical-align:middle}
.sync.err{background:#C0392B}
.iconbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;border:1.5px solid rgba(255,255,255,.5);flex:none}
.iconbtn:active{background:rgba(255,255,255,.15)}

/* Navegació: barra inferior fixa al mòbil, barra superior a l'ordinador */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav button{position:relative;min-height:var(--navh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted);font-size:.72rem;border-top:3px solid transparent}
.bnav button .ico{width:24px;height:24px}
.bnav button.on{color:var(--pri);font-weight:700;border-top-color:var(--gold)}
.bnav .cnt{position:absolute;top:6px;left:calc(50% + 6px);margin:0}
@media (min-width:900px){
  .bnav{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);display:flex;justify-content:center;gap:6px;padding:0 16px}
  .bnav button{flex-direction:row;gap:8px;min-height:54px;padding:0 18px;font-size:.9rem;border-top:0;border-bottom:3px solid transparent}
  .bnav button .ico{width:20px;height:20px}
  .bnav button.on{border-bottom-color:var(--gold)}
  .bnav .cnt{position:static;margin-left:2px}
}

/* ============ 4. COMPONENTS ============ */
main{padding:16px 0 calc(var(--navh) + 30px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){ main{padding-bottom:60px} }
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
h2.sec{font-family:var(--fd);font-size:1.3rem;margin:0;letter-spacing:.03em}
.ttl{margin:0;font-family:var(--fd);font-weight:700;font-size:1.25rem;line-height:1.15;text-wrap:balance}
.ttl.big{font-size:1.5rem}
.eyebrow{margin:6px 0 0;font-family:var(--fd);font-size:.75rem;letter-spacing:.08em;color:var(--muted);font-weight:700}
.h3{margin:0;font-family:var(--fd);font-size:.85rem;letter-spacing:.06em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.btn{min-height:48px;padding:0 18px;border-radius:12px;font-weight:700;background:var(--card);border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.btn.out{border-color:var(--pri);color:var(--pri)}
.btn.ok{background:var(--okc);color:var(--ok-ink);border-color:var(--okc)}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.warn{background:var(--coral);color:#fff;border-color:var(--coral)}
.btn.sm{min-height:42px;padding:0 14px;font-size:.88rem}
.btn.wide{width:100%}
.btn .ico{width:18px;height:18px}
.btn:disabled{opacity:.45;cursor:default}
.lnk{color:var(--pri);font-weight:700;font-size:.9rem;padding:8px 0;text-decoration:underline;text-underline-offset:3px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:.72rem;font-weight:700;letter-spacing:.04em;background:var(--soft);border:1px solid var(--line)}
.chip.joc{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.chip.ins{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
.chip.fi{background:var(--okc);color:var(--ok-ink);border-color:var(--okc)}
.dia{width:22px;height:22px;transform:rotate(45deg);border-radius:3px;flex:none;display:inline-grid;place-items:center}
.dia b{transform:rotate(-45deg);color:#fff;font-size:.72rem}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=search],select,textarea{width:100%;min-height:50px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--soft)}
textarea{min-height:130px;resize:vertical}
label.f{display:block;font-weight:700;margin:12px 0 6px;font-size:.92rem}
.seg{display:inline-flex;background:var(--seg);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{min-height:40px;padding:0 14px;border-radius:9px;font-weight:700;font-size:.88rem;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(19,33,58,.15)}
.segs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--seg);border-radius:12px;padding:4px;gap:4px;margin:4px 0 14px}
.segs button{min-height:42px;border-radius:9px;font-weight:700;font-size:.88rem;color:var(--muted);padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.segs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(19,33,58,.15)}
.segs button.on,.seg button.on{border:1.5px solid var(--line)}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.empty .big{font-size:2.6rem}
.cnt{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--pendc);color:#fff;font-size:.66rem;font-weight:700;margin-left:6px}
.req{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.req .nm{flex:1;min-width:180px;font-weight:700}
.req .nm small{display:block;font-weight:400;color:var(--muted);font-size:.85rem;word-break:break-all}
.hpf{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
details.more summary{cursor:pointer;font-weight:700;padding:14px 0;color:var(--muted);list-style:none}
details.more summary::before{content:"▸ "}
details.more[open] summary::before{content:"▾ "}
.pendtag{font-size:.72rem;font-weight:700;color:var(--pendc);border:1.5px solid var(--pendc);padding:2px 8px;border-radius:99px;white-space:nowrap}
.tno{width:28px;height:28px;border-radius:6px;background:var(--tnobg);color:#fff;display:grid;place-items:center;font-family:var(--fd);font-weight:700;font-size:.8rem;flex:none}
.medal,.posn{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:.85rem;flex:none}
.posn{color:var(--muted)}
.medal.m1{background:var(--m1);color:var(--m1i)} .medal.m2{background:var(--m2);color:var(--m2i)} .medal.m3{background:var(--m3);color:var(--m3i)}
.sqw,.sqb{display:inline-block;width:11px;height:11px;border-radius:2px;flex:none}
.sqw{background:#fff;border:1.5px solid var(--ink)} .sqb{background:var(--board);border:1.5px solid var(--board)}
:root[data-theme="dark"] .sqb{border-color:var(--muted)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sqb{border-color:var(--muted)}}

/* Inici */
.feat{display:flex;flex-direction:column;gap:12px}
.segbar{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px}
.segbar i{height:8px;border-radius:4px;background:var(--line)}
.segbar i.on{background:var(--pri)}
.mini{border-top:1px solid var(--line)}
.mrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem;line-height:1.3}
.lrow{display:flex;align-items:center;gap:12px;min-height:40px}
.lrow .nm{flex:1;font-weight:700;min-width:0}
.lrow .pt{font-family:var(--fd);font-weight:800;font-size:1.1rem;font-variant-numeric:tabular-nums}
.cta{background:var(--cta);color:#fff;border-radius:var(--r);padding:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cta>div{flex:1;min-width:180px}
.cta .ctat{font-family:var(--fd);font-weight:800;font-size:1.15rem}
.cta .ctas{font-size:.85rem;color:#CFD7E6;margin-top:2px}
.tlist{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.trow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);text-align:left;width:100%;min-height:64px}
.trow:last-child{border-bottom:0}
.trow .tx{flex:1;min-width:0}
.trow .tx b{display:block;font-size:1rem}
.trow .tx span{font-size:.8rem;color:var(--muted)}
.trow .chev{color:var(--muted)}
.trmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:6px}

/* Instal·lar l'app */
.inst{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.inst img{width:48px;height:48px;border-radius:12px;flex:none}
.inst .tx{flex:1;min-width:160px}
.inst .tx b{display:block}
.inst .tx span{font-size:.82rem;color:var(--muted)}
.steps{margin:10px 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px}
/* Torneig */
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 10px 0 2px;border-radius:10px;font-weight:700;color:var(--muted)}
.thead2{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}

/* Rondes i aparellaments */
.rounds{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:6px;scrollbar-width:thin}
.rounds button{flex:none;width:42px;height:42px;border-radius:10px;font-family:var(--fd);font-weight:800;font-size:.95rem;border:2px dashed var(--line);color:var(--muted);background:transparent}
.rounds button.done{border:2px solid var(--pri);color:var(--pri);background:var(--card)}
.rounds button.on{border:2px solid var(--pri);background:var(--pri);color:var(--pri-ink)}
.rounds button.cur:not(.on){border:2px solid var(--gold);color:var(--ink);background:var(--card)}
.rinfo{margin:4px 2px 10px;font-size:.88rem;color:var(--muted)}
.rinfo b{color:var(--ink)}
.legend{display:flex;gap:12px;align-items:center;font-size:.75rem}
.legend span{display:inline-flex;align-items:center;gap:5px}
.pairs{max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pair{border-bottom:1px solid var(--line)}
.pair:last-child{border-bottom:0}
.pair.open{background:color-mix(in srgb,var(--gold) 16%,var(--card))}
.prow3{display:grid;grid-template-columns:24px minmax(0,1fr) 74px minmax(0,1fr);gap:8px;align-items:center;padding:12px;width:100%;text-align:left;min-height:58px}
button.prow3:hover{background:color-mix(in srgb,var(--pri) 5%,transparent)}
.prow3 .n{font-family:var(--fd);font-weight:700;font-size:.8rem;color:var(--muted);text-align:center}
.side{display:flex;align-items:center;gap:6px;min-width:0}
.side.b{justify-content:flex-end;text-align:right}
.pn{font-size:.9rem;line-height:1.25;font-weight:700;overflow-wrap:anywhere}
.pn.lose{font-weight:400;color:var(--muted)}
.rp{justify-self:center;min-width:66px;text-align:center;padding:6px 4px;border-radius:8px;background:var(--ink);color:var(--card);font-family:var(--fd);font-weight:800;font-size:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.rp.pend{background:transparent;color:var(--pendc);border:1.5px dashed var(--pendc);font-size:.75rem;font-family:var(--fb)}
.rset{padding:0 12px 14px;display:flex;flex-direction:column;gap:8px}
.res3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.res3 button{min-height:50px;border-radius:12px;border:1.5px solid var(--pri);color:var(--pri);background:var(--card);font-family:var(--fd);font-weight:800;font-size:1rem}
.res3 button.on{background:var(--pri);color:var(--pri-ink)}
.byeline{margin:10px 4px 0;font-size:.85rem;color:var(--muted)}
.byeline b{color:var(--ink)}

/* Classificació */
.stand{padding:0;overflow:hidden}
.shead,.srow{display:grid;grid-template-columns:32px minmax(0,1fr) 52px 48px;gap:8px;align-items:center;padding:0 12px}
.shead{padding-top:9px;padding-bottom:9px;border-bottom:1px solid var(--line);font-size:.66rem;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.srow{min-height:58px;padding-top:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow.cut{border-bottom:2px solid var(--line)}
.srow.out{opacity:.55}
.srow .who{min-width:0;display:flex;flex-direction:column;gap:4px}
.srow .who b{font-size:.95rem;line-height:1.2;overflow-wrap:anywhere}
.srow .pt{font-family:var(--fd);font-weight:800;font-size:1.2rem;font-variant-numeric:tabular-nums}
.srow .tb{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.r{text-align:right}
.form{display:flex;gap:3px;flex-wrap:wrap}
.fc{width:20px;height:20px;border-radius:4px;display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:.66rem;font-style:normal}
.fc.w{background:var(--pri);color:var(--pri-ink)}
.fc.d{background:var(--draw-bg);color:var(--draw-ink)}
.fc.l{background:var(--card);color:var(--muted);border:1.5px solid var(--muted)}
.fc.p{background:var(--card);color:var(--pendc);border:1.5px dashed var(--pendc)}
.fc.y{background:var(--soft);color:var(--muted);border:1.5px dotted var(--muted)}
.flegend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 4px 0;font-size:.75rem;color:var(--muted);align-items:center}
.flegend span{display:inline-flex;align-items:center;gap:5px}
.xwrap{padding:0;overflow-x:auto}
table.xtab{border-collapse:collapse;font-size:.85rem;min-width:100%}
.xtab th,.xtab td{border:1px solid var(--line);padding:0;min-width:32px;height:36px;text-align:center;font-variant-numeric:tabular-nums}
.xtab th{font-size:.7rem;color:var(--muted);font-weight:700;background:var(--soft)}
.xtab .l{text-align:left;padding:0 10px;white-space:nowrap;font-weight:700;min-width:140px}
.xtab td.dg{background:var(--board)}
.xtab td.pt{font-family:var(--fd);font-weight:800;padding:0 8px}
.xtab td.w{font-weight:800;color:var(--pri)}

/* Panell d'organització */
.task{display:flex;flex-direction:column;gap:12px}
.task .top{display:flex;align-items:center;gap:12px}
.task .tx{flex:1;min-width:0}
.task .tx b{display:block;font-size:1rem}
.task .tx span{font-size:.82rem;color:var(--muted)}
.num{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:1.05rem;flex:none}
.num.red{background:var(--pendc);color:#fff}
.num.gold{background:var(--gold);color:var(--gold-ink)}
.num.navy{background:var(--pri);color:var(--pri-ink)}
.num.ok{background:var(--okc);color:var(--ok-ink)}
.num.next{border:1.5px solid var(--muted);color:var(--muted)}
.inits{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ini{width:32px;height:32px;border-radius:16px;background:var(--seg);color:var(--pri);display:grid;place-items:center;font-size:.72rem;font-weight:700}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){.qgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.qbtn{min-height:64px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:10px;padding:0 14px;font-weight:700;font-size:.88rem;text-align:left}
.qbtn .ico{color:var(--pri);width:22px;height:22px}
.qbtn:disabled{opacity:.45;cursor:default}

/* Persones */
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);min-height:58px}
.prow .nm{flex:1;min-width:0;font-weight:700}
.prow .nm small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.badge{font-size:.66rem;font-weight:700;padding:3px 8px;border-radius:99px;letter-spacing:.05em;flex:none}
.badge.prof{background:var(--pri);color:var(--pri-ink)} .badge.alum{background:var(--gold);color:var(--gold-ink)}
.addbtn{width:48px;height:48px;border-radius:12px;font-size:1.5rem;font-weight:800;background:var(--okc);color:var(--ok-ink);flex:none}
.rmbtn{width:48px;height:48px;border-radius:12px;font-size:1.3rem;background:var(--soft);border:1px solid var(--line);flex:none}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.cols{grid-template-columns:1fr}}

/* ============ 5. MODALS, MENÚ, TOAST ============ */
.scrim{position:fixed;inset:0;background:rgba(5,12,25,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.scrim{align-items:center}}
.modal{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(26px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.modal{border-radius:20px}}
.modal h3{margin:0 0 6px;font-family:var(--fd);font-size:1.2rem}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:hidden}
.page{position:absolute;inset:0;background:var(--bg);overflow:auto;transition:transform .25s ease}
.page.in{transform:translateX(100%)}
.pbar{position:sticky;top:0;background:var(--head);color:#fff;display:grid;grid-template-columns:56px 1fr 56px;align-items:center;min-height:64px;z-index:2}
.pbar h3{margin:0;text-align:center;font-family:var(--fd);font-size:1.05rem}
.pbar button{color:#fff;font-size:1.8rem;height:56px}
.mitem{display:flex;align-items:center;gap:14px;padding:18px 18px;border-bottom:1px solid var(--line);background:var(--card);width:100%;text-align:left;font-weight:700;min-height:64px}
.mitem small{display:block;font-weight:400;color:var(--muted)}
.mitem .dia{width:16px;height:16px}
.mitem::after{content:"›";margin-left:auto;font-size:1.6rem;color:var(--muted)}
.pbody{padding:18px 16px;max-width:700px;margin:0 auto}
.pbody p{margin:.4em 0 1em}
.toast{position:fixed;left:50%;bottom:calc(var(--navh) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(30px);opacity:0;visibility:hidden;background:var(--ink);color:var(--card);padding:12px 20px;border-radius:14px;font-weight:700;z-index:90;transition:transform .2s,opacity .2s;max-width:92vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
@media (min-width:900px){.toast{bottom:24px}}

/* Lliscador de confirmació */
.slide{position:relative;height:60px;border-radius:99px;background:color-mix(in srgb,var(--coral) 14%,var(--soft));border:2px solid var(--coral);margin-top:18px;user-select:none;touch-action:none;overflow:hidden}
.slide span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;color:var(--coral);letter-spacing:.04em;padding-left:50px}
.slide .knob{position:absolute;left:4px;top:4px;width:48px;height:48px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font-size:1.4rem;cursor:grab;touch-action:none}

/* ============ 6. PROJECCIÓ I INSCRIPCIÓ ============ */
.fs{position:fixed;inset:0;z-index:80;background:var(--head);color:#fff;overflow:auto;padding:24px 4vw}
.fs h2{font-family:var(--fd);font-size:clamp(1.6rem,4vw,3rem);margin:0}
.fs .fsbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
.fs .fsbar .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}
.fs .fsbar .btn.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.fsg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(520px,100%),1fr));gap:14px}
.fsgame{background:rgba(255,255,255,.08);border-radius:16px;padding:16px 20px;display:grid;grid-template-columns:auto 1fr auto 1fr;gap:14px;align-items:center;font-size:clamp(1.1rem,2.2vw,1.7rem);font-weight:700}
.fsgame .t{background:var(--gold);color:var(--gold-ink);border-radius:10px;padding:4px 12px;font-size:.8em}
.fsgame .vs{color:var(--gold);font-size:.85em}
table.st{width:100%;border-collapse:collapse}
table.st th{text-align:left;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;padding:8px}
table.st td{padding:12px 8px}
table.st td.n{text-align:right;font-variant-numeric:tabular-nums}
table.st td.pts{font-size:1.25rem;font-weight:800}
.fs table.st td,.fs table.st th{border-bottom:1px solid rgba(255,255,255,.18);color:#fff;font-size:clamp(1rem,2vw,1.6rem)}
.pos{font-weight:800;font-size:1.1rem;width:44px}
.kiosk{max-width:620px;margin:6vh auto 0;text-align:center}
.kiosk input{font-size:1.4rem;min-height:64px;text-align:center;background:#fff;color:#13213A}
.kiosk .btn{min-height:66px;font-size:1.3rem;width:100%;margin-top:14px}
.kiosk .okmsg{font-size:1.6rem;font-weight:800;color:var(--gold);min-height:2.2em;margin-top:18px}

/* ============ 7. AJUSTOS DE MÒBIL (al final perquè guanyin) ============ */
@media (max-width:620px){
  .hrow{min-height:66px;gap:10px}
  .hrow .logo{height:38px}
  .hrow .vr{margin:12px 0}
  .brandtxt h1{font-size:1.2rem}
  .brandtxt small{font-size:.66rem}
  h2.sec{font-size:1.15rem}
  .ttl.big{font-size:1.3rem}
  .segs button{font-size:.8rem}
  .segs .sn{display:none}
  .prow3{grid-template-columns:22px minmax(0,1fr) 66px minmax(0,1fr);gap:6px;padding:12px 10px}
  .rp{min-width:60px;font-size:.85rem}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }

</style>
</head>

<script>
/* =========================================================
   ESCACS 3 TURONS — gestor de tornejos (un sol fitxer)
   Dades: localStorage + exportar/importar JSON + dades.json publicat
   ========================================================= */

/* ---------- 1. DADES INICIALS ---------- */
const KEY = 'escacs3t_v1';          // dades de treball de l'organització (només aquest navegador)
const PREF_KEY = 'escacs3t_prefs';   // aspecte (de cada dispositiu)
const ADM_KEY = 'escacs3t_admin';    // '1' si aquest dispositiu està en mode organització
const PIN_KEY = 'escacs3t_pin';      // PIN del mode organització (connexió amb Google Sheets)
const API_KEY = 'escacs3t_api';      // URL de l'script desat en aquest dispositiu (opcional)

/* URL de l'aplicació web d'Apps Script (acaba en /exec). Si és buit, la web funciona
   en mode local (navegador + dades.json). Vegeu apps-script.gs per configurar-ho. */
const API_URL = 'https://script.google.com/macros/s/AKfycbxIEs2lHMd970G0mGs4wwI8eJQRBZqldttvnuoNAMggAlCTgxWwEuXZFW7EFlDfcnI/exec';
const POLL_MS = 20000;               // cada quant es comproven canvis d'altres persones
const PROFESSORAT = ['David Filgaira','Roc Biosca','Manel Jimenez','Oriol Barber','Oriol Berengueres',
  'Alicia Martin','Victor Aguilar','Tomas Martinez','Brian David Saimur','Alberto Bernabeu'];

function seed(){
  const players = PROFESSORAT.map(n => ({id:uid(), name:n, type:'prof', group:'Professorat'}));
  return {
    v:1, players,
    tournaments:[{
      id:uid(), name:'Torneig del professorat 2026-27', format:'lliga', nRounds:0,
      status:'inscripcio', playerIds:players.map(p=>p.id), out:[], rounds:[], date:today()
    }],
  };
}

/* ---------- 2. UTILITATS ---------- */
function uid(){ return Math.random().toString(36).slice(2,10); }
function today(){ return new Date().toISOString().slice(0,10); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function fmt(n){ return Number.isInteger(n) ? String(n) : (Math.floor(n)||'') + '½'; }
function norm(s){ return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
const $ = s => document.querySelector(s);

/* ---------- 2b. GOOGLE SHEETS (dades compartides) ---------- */
let VER = 0, pushing = false, dirty = false, pendingOps = [], curAct = null, online = true;
function api(){ try{ return localStorage.getItem(API_KEY) || API_URL; }catch(e){ return API_URL; } }
function remote(){ return !!api(); }
function getPin(){ try{ return localStorage.getItem(PIN_KEY)||''; }catch(e){ return ''; } }
async function apiGet(url){ const r = await fetch((url||api())+'?t='+Date.now(), {cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
async function apiPost(body, url){ const r = await fetch(url||api(), {method:'POST', body:JSON.stringify(body)}); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
function setSync(st){
  const el=$('#sync'); if(!el) return;
  if(!remote()){ el.classList.add('hidden'); return; }
  const txt = {ok: admin?'● DESAT':'● EN DIRECTE', saving:'⟳ DESANT…', off:'⚠ SENSE CONNEXIÓ', conflict:'⟳ COMBINANT…'}[st]||'';
  el.textContent=txt; el.classList.toggle('hidden', !txt); el.classList.toggle('err', st==='off');
}
function strip(d){ const c=JSON.parse(JSON.stringify(d)); delete c.pin; return c; }
const REPLAYABLE = new Set(['res','enrol','unenrol','withdraw']);
async function push(){
  if(pushing){ dirty=true; return; }
  pushing=true; dirty=false; setSync('saving');
  const ops = pendingOps; pendingOps = [];
  try{
    const r = await apiPost({action:'save', pin:getPin(), base:VER, data:strip(S)});
    online=true;
    if(r.ok){ VER=r.ver; setSync('ok'); }
    else if(r.conflict){
      // Algú altre ha desat abans: agafem la seva versió i hi tornem a aplicar els nostres canvis
      setSync('conflict'); S=sanitize(r.data||seed()); VER=r.ver;
      let lost=false;
      ops.forEach(op=>{ if(op && REPLAYABLE.has(op.act)){ const prev=curAct; curAct=op; try{ A[op.act](op.d); }catch(e){ lost=true; } curAct=prev; } else lost=true; });
      if(!ops.some(op=>op&&REPLAYABLE.has(op.act))) render();
      if(lost) toast('Una altra persona havia fet canvis. S\'han carregat: revisa i torna a fer l\'últim canvi.');
      else if(!pendingOps.length) setSync('ok');
    }
    else if(r.error==='pin'){ admin=false; try{localStorage.removeItem(ADM_KEY);localStorage.removeItem(PIN_KEY);}catch(e){} applyPrefs(); render(); toast('El PIN ha canviat. Torna a entrar al mode organització.'); }
    else toast('Error en desar: '+(r.error||'desconegut'));
  }catch(e){ online=false; setSync('off'); pendingOps = ops.concat(pendingOps); dirty=true; setTimeout(()=>{ if(dirty && !pushing) push(); }, 10000); pushing=false; return; }
  pushing=false;
  if(dirty || pendingOps.length) push();
}
async function poll(){
  if(!remote() || pushing || dirty || pendingOps.length || document.visibilityState!=='visible') return;
  if(document.querySelector('#layer .scrim, #layer .sheet')) return;      // hi ha un formulari obert
  const a=document.activeElement; if(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  if(admin) reqLoad();
  try{ const r=await apiGet(); online=true; setSync('ok');
    if(r.data && r.ver>VER && !pushing && !dirty){ S=sanitize(r.data); VER=r.ver; if(admin) try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
      if(!$('#layer').children.length) render(); else if(window._fsRedraw) window._fsRedraw(); }
  }catch(e){ online=false; setSync('off'); }
}

function reqLocal(){ try{ return JSON.parse(localStorage.getItem(REQ_KEY)||'[]'); }catch(e){ return []; } }
function reqLocalSave(l){ try{ localStorage.setItem(REQ_KEY, JSON.stringify(l)); }catch(e){} }
async function reqSend(r){
  if(remote()) return apiPost({action:'request', ...r});
  const l=reqLocal();
  if(l.some(x=>x.estat==='pendent' && x.email===r.email && x.tid===r.tid)) return {ok:true, dup:true};
  l.push({id:uid(), data:new Date().toISOString(), nom:r.nom, email:r.email, tid:r.tid, tnom:r.tnom, estat:'pendent'}); reqLocalSave(l); return {ok:true};
}
async function reqLoad(){
  if(!admin) return;
  if(remote()){ try{ const r=await apiPost({action:'requests', pin:getPin()}); if(r.ok) REQ=r.list||[]; }catch(e){ return; } }
  else REQ = reqLocal().filter(x=>x.estat!=='acceptada');
  reqBadge(); if((ui.view==='req'||ui.view==='home') && !$('#layer').children.length) render();
}
async function reqResolve(id, estat, pid){
  const x=REQ.find(r=>r.id===id); if(x) x.estat=estat;
  REQ = REQ.filter(r=>r.estat!=='acceptada');
  if(remote()){ try{ await apiPost({action:'resolve', pin:getPin(), id, estat, pid}); }catch(e){ toast('Sense connexió: torna-ho a provar'); } }
  else { const l=reqLocal(); const y=l.find(r=>r.id===id); if(y){ y.estat=estat; y.pid=pid||''; } reqLocalSave(l); }
}

/* ---------- 3. PUNTUACIÓ I DESEMPATS ---------- */
const BYE_PTS = t => t.format==='suis' ? 1 : 0;   // suís: descans = 1 punt; lliga: 0 (tothom en té un)

function standings(t){
  const ids = [...new Set([...t.playerIds, ...t.rounds.flat().flatMap(g=>[g.w,g.b]).filter(Boolean)])];
  const R = {}; ids.forEach(id=>R[id]={id, pts:0, wins:0, played:0, games:[]});
  t.rounds.forEach(r=>r.forEach(g=>{
    if(g.b==null){ if(g.res==='bye' && R[g.w]) R[g.w].pts += BYE_PTS(t); return; }
    if(!g.res) return;
    const [a,b] = g.res==='1-0'?[1,0]:g.res==='0-1'?[0,1]:[.5,.5];
    R[g.w].pts+=a; R[g.b].pts+=b; R[g.w].played++; R[g.b].played++;
    if(a===1)R[g.w].wins++; if(b===1)R[g.b].wins++;
    R[g.w].games.push([g.b,a]); R[g.b].games.push([g.w,b]);
  }));
  Object.values(R).forEach(x=>{
    x.buch = x.games.reduce((s,[o])=>s+R[o].pts,0);
    x.sb   = x.games.reduce((s,[o,sc])=>s+sc*R[o].pts,0);
    x.tb   = t.format==='suis' ? x.buch : x.sb;
  });
  return Object.values(R).sort((a,b)=> b.pts-a.pts || b.tb-a.tb || b.wins-a.wins || P(a.id).name.localeCompare(P(b.id).name));
}

/* ---------- 4. APARELLAMENTS ---------- */
// Lliga (tothom contra tothom): mètode del cercle, totes les rondes de cop
function roundRobin(ids){
  let a = shuffle(ids.slice()); if(a.length%2) a.push(null);
  const n=a.length, rounds=[];
  for(let r=0;r<n-1;r++){
    const games=[], byes=[];
    for(let i=0;i<n/2;i++){
      let x=a[i], y=a[n-1-i];
      if((r+i)%2) [x,y]=[y,x];
      if(x==null || y==null) byes.push({w:x??y, b:null, res:'bye'});
      else games.push({w:x, b:y, res:null});
    }
    rounds.push(games.concat(byes));
    a = [a[0], a[n-1], ...a.slice(1,n-1)];
  }
  return rounds;
}

// Suís: aparella per punts evitant repetir rivals
function swissRound(t){
  const st = standings(t).filter(x=>t.playerIds.includes(x.id) && !t.out.includes(x.id));
  let list = st.map(x=>x.id);
  if(t.rounds.length===0) shuffle(list);
  const played = new Set(), hadBye = new Set(), whites={}, last={};
  t.rounds.forEach(r=>r.forEach(g=>{
    if(g.b==null){ hadBye.add(g.w); return; }
    played.add(g.w+'|'+g.b); played.add(g.b+'|'+g.w);
    whites[g.w]=(whites[g.w]||0)+1; last[g.w]='w'; last[g.b]='b';
  }));
  let bye=null;
  if(list.length%2){
    for(let i=list.length-1;i>=0;i--) if(!hadBye.has(list[i])){ bye=list[i]; break; }
    if(bye==null) bye=list[list.length-1];
    list = list.filter(x=>x!==bye);
  }
  let steps=0;
  const rec = (arr, allowRe) => {
    if(!arr.length) return [];
    if(++steps>40000) return null;
    const a=arr[0];
    for(let j=1;j<arr.length;j++){
      const b=arr[j];
      if(!allowRe && played.has(a+'|'+b)) continue;
      const r = rec(arr.filter((_,k)=>k!==0&&k!==j), allowRe);
      if(r) return [[a,b],...r];
    }
    return null;
  };
  let pairs = rec(list,false); if(!pairs){ steps=0; pairs = rec(list,true); }
  const games = pairs.map(([a,b])=>{
    const wa=whites[a]||0, wb=whites[b]||0;
    let swap = wa>wb || (wa===wb && last[a]==='w' && last[b]!=='w');
    return swap ? {w:b,b:a,res:null} : {w:a,b:b,res:null};
  });
  if(bye) games.push({w:bye,b:null,res:'bye'});
  return games;
}
function suggestRounds(n){ return Math.max(3, Math.min(9, Math.ceil(Math.log2(Math.max(2,n)))+2)); }
function roundDone(r){ return r.every(g=>g.b==null || g.res); }
function totalRounds(t){ return t.format==='lliga' ? t.rounds.length : t.nRounds; }

function installCard(){
  if(!canOfferInstall() || instDismissed()) return '';
  return `<section class="card inst"><img src="icon-192.png" alt=""><div class="tx"><b>Instal·la l'app</b><span>Accés directe des de la pantalla d'inici, també sense connexió.</span></div>
    <div class="row"><button class="btn sm" data-act="instOff">Ara no</button><button class="btn pri sm" data-act="install">Instal·la</button></div></section>`;
}

function featured(){ const ts=S.tournaments; return ts.find(t=>t.status==='enjoc') || ts.find(t=>t.status==='inscripcio') || ts.find(t=>t.status==='acabat') || null; }
function curRound(t){ const i=t.rounds.findIndex(r=>!roundDone(r)); return i<0 ? Math.max(0,t.rounds.length-1) : i; }
function initials(n){ return String(n).trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase(); }
function fmtTb(x){ return Number.isInteger(x) ? String(x) : String(Math.round(x*100)/100).replace('.',','); }
function fmtDesc(t){ return t.format==='lliga' ? 'Lliga · tothom contra tothom' : 'Suís · '+t.nRounds+' rondes'; }
function plural(n,a,b){ return n+' '+(n===1?a:b); }

function render(){
  if(!S){ $('#app').innerHTML='<div class="empty">Carregant…</div>'; return; }
  document.body.classList.toggle('adm-mode', admin);
  const app=$('#app');
  if(ui.view==='tour' && T(ui.tid)) app.innerHTML = vTour(T(ui.tid));
  else if(ui.view==='people' && admin) { app.innerHTML = vPeople(); fillPeople(); }
  else if(ui.view==='req' && admin) { app.innerHTML = `<div class="narrow">${vReq()}</div>`; }
  else { ui.view='home'; app.innerHTML = admin ? vPanel() : vHome(); }
  if(ui.view==='tour' && ui.sub==='jug') fillPicker();
  navUpdate(); reqBadge();
}
function navUpdate(){
  const items = admin
    ? [['home','Panell',IC.panel],['ron','Rondes',IC.rounds],['people','Persones',IC.people],['req','Sol·licituds',IC.req]]
    : [['home','Inici',IC.home],['ron','Rondes',IC.rounds],['cla','Classificació',IC.stand],['signup','Inscriu-te',IC.join]];
  const cur = ui.view==='tour' ? (ui.sub==='cla' ? 'cla' : ui.sub==='ron' ? 'ron' : '') : ui.view;
  $('#bnav').innerHTML = items.map(([k,l,ic])=>`<button data-act="${k==='signup'?'signup':'nav'}" data-v="${k}" class="${cur===k?'on':''}"${cur===k?' aria-current="page"':''}>${ic}<span>${l}</span>${k==='req'?'<span id="reqCnt" class="cnt hidden"></span>':''}</button>`).join('');
}

function statusChip(t){
  if(t.status==='inscripcio') return `<span class="chip ins">INSCRIPCIÓ OBERTA</span>`;
  if(t.status==='enjoc') return `<span class="chip joc">EN JOC · RONDA ${curRound(t)+1} DE ${totalRounds(t)}</span>`;
  return `<span class="chip fi">ACABAT</span>`;
}
function tRow(t){
  return `<button class="trow" data-act="open" data-id="${t.id}">
    <span class="tx"><b>${esc(t.name)}</b><span class="trmeta">${statusChip(t)}<span>${t.format==='lliga'?'Lliga':'Suís'} · ${plural(t.playerIds.length,'participant','participants')}</span></span></span>
    <span class="chev">${IC.chev}</span></button>`;
}
function tourLists(skip){
  const rest = S.tournaments.filter(t=>t!==skip);
  const act = rest.filter(t=>t.status!=='acabat'), fin = rest.filter(t=>t.status==='acabat');
  return `${act.length?`<h3 class="eyebrow">${skip?'ALTRES TORNEJOS':'TORNEJOS'}</h3><div class="tlist">${act.map(tRow).join('')}</div>`:''}
    ${fin.length?`<details class="more"><summary>Tornejos acabats (${fin.length})</summary><div class="tlist">${fin.map(tRow).join('')}</div></details>`:''}`;
}

/* --- Inici públic --- */
function featCard(f){
  if(!f) return `<section class="card empty"><div class="big">♞</div><p>Encara no hi ha cap torneig. Apunta't i t'avisarem del primer.</p></section>`;
  if(f.status==='inscripcio') return `<section class="card feat">
      <div class="spread">${statusChip(f)}<span class="muted small">${f.format==='lliga'?'Lliga':'Suís'}</span></div>
      <h2 class="ttl">${esc(f.name)}</h2>
      <div class="muted">${plural(f.playerIds.length,'inscripció','inscripcions')} fins ara</div>
      <div class="two"><button class="btn out" data-act="open" data-id="${f.id}">Qui hi juga</button><button class="btn gold" data-act="signup" data-tid="${f.id}">Inscriu-te</button></div>
    </section>`;
  if(f.status==='acabat'){ const w=standings(f)[0];
    return `<section class="card feat">
      <div class="spread">${statusChip(f)}</div>
      <h2 class="ttl">${esc(f.name)}</h2>
      ${w?`<div class="lrow"><span class="medal m1">1</span><span class="nm">${esc(P(w.id).name)}</span><span class="pt">${fmt(w.pts)}</span></div>`:''}
      <button class="btn pri wide" data-act="nav" data-v="cla" data-tid="${f.id}">Classificació final ${IC.arrow}</button>
    </section>`; }
  const ri=curRound(f), r=f.rounds[ri]||[], real=r.filter(g=>g.b!=null), done=real.filter(g=>g.res).length;
  const pend=real.map((g,i)=>({g,n:i+1})).filter(x=>!x.g.res);
  return `<section class="card feat">
    <div class="spread">${statusChip(f)}<span class="muted small">${f.format==='lliga'?'Lliga':'Suís'}</span></div>
    <h2 class="ttl">${esc(f.name)}</h2>
    <div class="segbar" style="--n:${Math.max(1,real.length)}">${real.map(g=>`<i class="${g.res?'on':''}"></i>`).join('')}</div>
    <div class="muted small">${done} de ${real.length} partides acabades${pend.length?` · falten ${pend.length}`:''}</div>
    ${pend.length?`<div class="mini">${pend.slice(0,3).map(({g,n})=>`<div class="mrow"><span class="tno">${n}</span><span><b>${esc(P(g.w).name)}</b> <span class="muted">contra</span> <b>${esc(P(g.b).name)}</b></span><span class="pendtag">Pendent</span></div>`).join('')}</div>`:''}
    <button class="btn pri wide" data-act="nav" data-v="ron" data-tid="${f.id}">Veure la ronda ${ri+1} ${IC.arrow}</button>
  </section>`;
}
function leadersCard(f){
  if(!f || f.status==='inscripcio') return '';
  const st=standings(f); if(!st.some(x=>x.played)) return '';
  return `<section class="card">
    <div class="spread"><h3 class="h3">${f.status==='acabat'?'PODI':'CAPDAVANTERS'}</h3><button class="lnk" data-act="nav" data-v="cla" data-tid="${f.id}">Tota la classificació</button></div>
    ${st.slice(0,3).map((x,i)=>`<div class="lrow"><span class="medal m${i+1}">${i+1}</span><span class="nm">${esc(P(x.id).name)}</span><span class="pt">${fmt(x.pts)}</span></div>`).join('')}
  </section>`;
}
function vHome(){
  const f=featured(), open=openTours();
  const cta = (f && f.status==='inscripcio' && open.length===1) ? '' : `<section class="cta"><div><div class="ctat">Vols jugar?</div>
      <div class="ctas">${open.length===1?esc(open[0].name)+' · inscripció oberta':open.length?open.length+' tornejos amb inscripció oberta':'Apunta\'t i t\'avisarem quan s\'organitzi el proper torneig'}</div></div>
      <button class="btn gold" data-act="signup">Inscriu-te</button></section>`;
  return `<div class="narrow stack">${featCard(f)}${leadersCard(f)}${cta}${installCard()}${tourLists(f)}</div>`;
}

/* --- Panell d'organització --- */
function task(num, cls, title, sub, actions, extra=''){
  return `<section class="card task"><div class="top"><span class="num ${cls}">${num}</span><div class="tx"><b>${title}</b><span>${sub}</span></div>${actions.length===1?actions[0]:''}</div>${extra}${actions.length>1?`<div class="two">${actions.join('')}</div>`:''}</section>`;
}
function vPanel(){
  const tasks=[];
  const pend=REQ.filter(r=>r.estat==='pendent');
  if(pend.length){
    const tn=[...new Set(pend.map(r=>r.tid?(T(r.tid)?.name||r.tnom):'Propers tornejos'))].join(' · ');
    const names=pend.slice(0,3).map(r=>esc(r.nom.split(' ')[0])).join(', ')+(pend.length>3?` i ${pend.length-3} més`:'');
    tasks.push(task(pend.length,'red','Sol·licituds d\'inscripció',esc(tn),
      [`<button class="btn out" data-act="nav" data-v="req">Revisar</button>`,`<button class="btn ok" data-act="reqAllAny">Acceptar totes</button>`],
      `<div class="inits">${pend.slice(0,4).map(r=>`<span class="ini">${esc(initials(r.nom))}</span>`).join('')}<span class="muted small">${names}</span></div>`));
  }
  S.tournaments.filter(t=>t.status==='enjoc').forEach(t=>{
    const ri=curRound(t), real=(t.rounds[ri]||[]).map((g,i)=>({g})).filter(x=>x.g.b!=null);
    const pg=real.map((x,i)=>({...x,n:i+1})).filter(x=>!x.g.res);
    if(pg.length) tasks.push(task(pg.length,'gold','Resultats per posar',`${esc(t.name)} · ronda ${ri+1} · ${pg.length===1?'taula':'taules'} ${pg.map(x=>x.n).join(', ')}`,
      [`<button class="btn pri sm" data-act="nav" data-v="ron" data-tid="${t.id}">Posar</button>`]));
    else if(t.format==='suis' && t.rounds.length<t.nRounds) tasks.push(task('+','navy',`Generar la ronda ${t.rounds.length+1}`,esc(t.name),
      [`<button class="btn pri sm" data-act="nextRound" data-tid="${t.id}">Generar</button>`]));
    else tasks.push(task('✓','ok','Totes les partides jugades',`${esc(t.name)} · ja es pot tancar`,
      [`<button class="btn ok sm" data-act="finish" data-tid="${t.id}">Tancar</button>`]));
  });
  S.tournaments.filter(t=>t.status==='inscripcio').forEach(t=>{
    tasks.push(task(t.playerIds.length,'navy','Inscripció oberta',`${esc(t.name)} · ${plural(t.playerIds.length,'inscripció','inscripcions')}`,
      [`<button class="btn out" data-act="open" data-id="${t.id}">Gestionar</button>`,`<button class="btn ok" data-act="start" data-tid="${t.id}" ${t.playerIds.length<2?'disabled':''}>Començar</button>`]));
  });
  const f=featured(), started=S.tournaments.find(t=>t.status!=='inscripcio'&&t.rounds.length), op=openTours()[0];
  return `<div class="narrow stack">
    <h3 class="eyebrow">CAL FER ARA</h3>
    ${tasks.length?tasks.join(''):`<section class="card task"><div class="top"><span class="num ok">✓</span><div class="tx"><b>Tot al dia</b><span>No hi ha res pendent.</span></div></div></section>`}
    <div class="spread"><h3 class="eyebrow">TORNEJOS</h3></div>
    ${S.tournaments.length?`<div class="tlist">${S.tournaments.filter(t=>t.status!=='acabat').map(tRow).join('')}</div>`:''}
    ${S.tournaments.some(t=>t.status==='acabat')?`<details class="more"><summary>Tornejos acabats (${S.tournaments.filter(t=>t.status==='acabat').length})</summary><div class="tlist">${S.tournaments.filter(t=>t.status==='acabat').map(tRow).join('')}</div></details>`:''}
    <h3 class="eyebrow">ACCIONS</h3>
    <div class="qgrid">
      <button class="qbtn" data-act="newT">${IC.plus}Nou torneig</button>
      <button class="qbtn" data-act="project" ${started?`data-tid="${(f&&f.rounds.length?f:started).id}"`:'disabled'}>${IC.screen}Projectar</button>
      <button class="qbtn" data-act="kiosk" ${op?`data-tid="${op.id}"`:'disabled'}>${IC.tablet}Inscripció a la tauleta</button>
      <button class="qbtn" data-act="backup">${IC.save}Còpia de seguretat</button>
    </div>
  </div>`;
}

/* --- Vista d'un torneig --- */
function vTour(t){
  if(!ui.sub) ui.sub = t.status==='inscripcio' ? 'jug' : (admin ? 'ron' : 'cla');
  const sub = ui.sub;
  let actions='';
  if(admin){
    if(t.status==='inscripcio') actions = `<button class="btn ok sm" data-act="start" ${t.playerIds.length<2?'disabled':''}>${IC.play}Començar</button>`;
    else if(t.status==='enjoc'){ const allDone = t.rounds.length && t.rounds.every(roundDone) && t.rounds.length>=totalRounds(t);
      if(allDone) actions = `<button class="btn ok sm" data-act="finish">Tancar el torneig</button>`; }
    else actions = `<button class="btn sm" data-act="reopen">Reobrir</button>`;
  }
  const tabs = [['ron','Rondes'],['cla','Classificació'],['jug','Participants<span class="sn"> ('+t.playerIds.length+')</span>']];
  return `<div class="narrow">
  <button class="back" data-act="nav" data-v="home">${IC.back}${admin?'Panell':'Inici'}</button>
  <div class="thead2">
    <h2 class="ttl big">${esc(t.name)}</h2>
    <div class="row">${statusChip(t)}<span class="chip">${fmtDesc(t)}</span></div>
    <div class="row">
      ${t.status!=='inscripcio'?`<button class="btn sm" data-act="project">${IC.screen}Projectar</button>`:''}
      ${admin?`<button class="btn sm" data-act="editT">${IC.edit}Editar</button>`:''}
      ${!admin && t.status==='inscripcio' ? `<button class="btn gold sm" data-act="signup" data-tid="${t.id}">Inscriu-te</button>`:''}
      ${actions}
    </div>
  </div>
  <div class="segs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${sub===k}" class="${sub===k?'on':''}" data-act="sub" data-v="${k}">${l}</button>`).join('')}</div>
  ${sub==='ron'?vRounds(t):sub==='cla'?vStand(t):vEnrol(t)}</div>`;
}

function vRounds(t){
  if(t.status==='inscripcio') return `<div class="card empty"><div class="big">♟</div><p>${admin?'Quan la llista de participants estigui a punt, prem <b>Començar</b> i es generaran els aparellaments.':'El torneig encara no ha començat. Consulta les inscripcions a <b>Participants</b>.'}</p></div>`;
  if(ui.round>=t.rounds.length) ui.round = Math.max(0, t.rounds.length-1);
  const ri = ui.round, r = t.rounds[ri], lock = t.status==='acabat' || !admin, cr = curRound(t);
  const chips = t.rounds.map((x,i)=>`<button class="${i===ri?'on':''} ${roundDone(x)?'done':''} ${i===cr&&!roundDone(x)?'cur':''}" data-act="round" data-v="${i}" aria-label="Ronda ${i+1}">${i+1}</button>`).join('')
    + (t.format==='suis' ? Array.from({length:Math.max(0,t.nRounds-t.rounds.length)},(_,i)=>`<button disabled aria-label="Ronda ${t.rounds.length+i+1}, encara no generada">${t.rounds.length+i+1}</button>`).join('') : '');
  const real = r.filter(g=>g.b!=null), done = real.filter(g=>g.res).length;
  let n=0;
  const rows = r.map((g,gi)=>{
    if(g.b==null) return '';
    n++;
    const wW=g.res==='1-0', bW=g.res==='0-1', open = !lock && ui.openG===gi;
    const tag = lock ? 'div' : 'button';
    return `<div class="pair ${open?'open':''}">
      <${tag} class="prow3" ${lock?'':`data-act="openGame" data-g="${gi}" aria-expanded="${open}" aria-label="Taula ${n}: posar el resultat"`}>
        <span class="n">${n}</span>
        <span class="side"><i class="sqw"></i><span class="pn ${bW?'lose':''}">${esc(P(g.w).name)}</span></span>
        <span class="rp ${g.res?'':'pend'}">${g.res?g.res.replace('-',' – '):'Pendent'}</span>
        <span class="side b"><span class="pn ${wW?'lose':''}">${esc(P(g.b).name)}</span><i class="sqb"></i></span>
      </${tag}>
      ${open?`<div class="rset"><div class="muted small">Tria el resultat de la taula ${n}</div>
        <div class="res3">${['1-0','½-½','0-1'].map(v=>`<button class="${g.res===v?'on':''}" data-act="res" data-g="${gi}" data-v="${v}">${v.replace('-',' – ')}</button>`).join('')}</div>
        ${g.res?`<button class="lnk" data-act="res" data-g="${gi}" data-v="${g.res}">Esborra el resultat</button>`:''}</div>`:''}
    </div>`;
  }).join('');
  const byes = r.filter(g=>g.b==null).map(g=>`<p class="byeline">Descansa: <b>${esc(P(g.w).name)}</b> ${BYE_PTS(t)?'(+1 punt)':'(0 punts)'}</p>`).join('');
  let next='';
  if(admin && t.status==='enjoc' && t.format==='suis' && roundDone(r) && ri===t.rounds.length-1 && t.rounds.length<t.nRounds)
    next = `<div class="card" style="margin-top:14px;text-align:center"><p style="margin-top:0">Ronda ${ri+1} completa.</p><button class="btn pri" data-act="nextRound">Generar la ronda ${ri+2}</button></div>`;
  return `<div class="rounds" role="tablist" aria-label="Rondes">${chips}</div>
    <div class="spread rinfo"><span><b>${done} de ${real.length}</b> resultats · ronda ${ri+1}</span>
      <span class="legend"><span><i class="sqw"></i>Blanques</span><span><i class="sqb"></i>Negres</span></span></div>
    <div class="pairs">${rows}</div>${byes}
    ${!lock && real.some(g=>!g.res) && ui.openG==null ? `<p class="byeline">Toca una partida per posar-hi el resultat.</p>`:''}${next}`;
}

function formChips(t, id){
  const upto = t.status==='acabat' ? t.rounds.length-1 : curRound(t);
  return t.rounds.slice(0, upto+1).map((r,i)=>{
    const g=r.find(x=>x.w===id||x.b===id); if(!g) return '';
    if(g.b==null) return `<i class="fc y" title="Ronda ${i+1}: descans">D</i>`;
    if(!g.res) return `<i class="fc p" title="Ronda ${i+1}: per jugar">·</i>`;
    const me = g.res==='½-½' ? '½' : ((g.res==='1-0')===(g.w===id) ? '1' : '0');
    return `<i class="fc ${me==='1'?'w':me==='½'?'d':'l'}" title="Ronda ${i+1}">${me}</i>`;
  }).join('');
}
function vStand(t){
  if(t.status==='inscripcio') return `<div class="card empty"><div class="big">♛</div><p>La classificació apareixerà quan comenci el torneig.</p></div>`;
  const st = standings(t), tbN = t.format==='suis' ? 'Buchholz' : 'Sonneborn-Berger', tbS = t.format==='suis' ? 'Buch.' : 'S-B';
  const mode = ui.stm||'pts';
  const seg = `<div class="seg" role="tablist" style="margin-bottom:12px">${[['pts','Taula de punts'],['xt','Quadre creuat']].map(([k,l])=>`<button role="tab" aria-selected="${mode===k}" class="${mode===k?'on':''}" data-act="stm" data-v="${k}">${l}</button>`).join('')}</div>`;
  if(mode==='xt'){
    const idx={}; st.forEach((x,i)=>idx[x.id]=i);
    const M=st.map(()=>st.map(()=>[]));
    t.rounds.forEach(r=>r.forEach(g=>{ if(g.b==null||!g.res||idx[g.w]==null||idx[g.b]==null) return;
      const a=g.res==='1-0'?'1':g.res==='0-1'?'0':'½', b=g.res==='1-0'?'0':g.res==='0-1'?'1':'½';
      M[idx[g.w]][idx[g.b]].push(a); M[idx[g.b]][idx[g.w]].push(b); }));
    return `${seg}<div class="card xwrap"><table class="xtab"><thead><tr><th>#</th><th class="l">Participant</th>${st.map((_,j)=>`<th>${j+1}</th>`).join('')}<th>Pts</th></tr></thead>
      <tbody>${st.map((x,i)=>`<tr><th>${i+1}</th><td class="l">${esc(P(x.id).name)}</td>${st.map((_,j)=>i===j?'<td class="dg"></td>':`<td class="${M[i][j].includes('1')?'w':''}">${M[i][j].join(' ')}</td>`).join('')}<td class="pt">${fmt(x.pts)}</td></tr>`).join('')}</tbody></table></div>
      <p class="byeline">Cada fila mostra el que ha fet aquella persona contra la de cada columna.</p>`;
  }
  return `${seg}<div class="card stand">
    <div class="shead"><span>#</span><span>Participant · rondes</span><span class="r">Punts</span><span class="r">${tbS}</span></div>
    ${st.map((x,i)=>`<div class="srow ${i===2&&st.length>3?'cut':''} ${t.out.includes(x.id)?'out':''}">
      <span class="${i<3&&x.played?'medal m'+(i+1):'posn'}">${i+1}</span>
      <span class="who"><b>${esc(P(x.id).name)}${t.out.includes(x.id)?' <span class="chip">de baixa</span>':''}</b><span class="form">${formChips(t,x.id)}</span></span>
      <span class="pt r">${fmt(x.pts)}</span><span class="tb r">${fmtTb(x.tb)}</span></div>`).join('')}
  </div>
  <div class="flegend"><span><i class="fc w">1</i>Victòria</span><span><i class="fc d">½</i>Taules</span><span><i class="fc l">0</i>Derrota</span><span><i class="fc p">·</i>Per jugar</span>${t.rounds.some(r=>r.some(g=>g.b==null))?'<span><i class="fc y">D</i>Descans</span>':''}</div>
  <p class="byeline">Desempat: 1) punts, 2) ${tbN} (${t.format==='suis'?'suma de punts dels rivals':'punts dels rivals guanyats + meitat dels empatats'}), 3) victòries.</p>`;
}

function vEnrol(t){
  const canAdd = admin && (t.status==='inscripcio' || (t.status==='enjoc' && t.format==='suis'));
  const canRm = admin && t.status==='inscripcio';
  const midSwiss = admin && t.status==='enjoc' && t.format==='suis';
  const enrolled = t.playerIds.map(P).sort((a,b)=>a.name.localeCompare(b.name));
  const left = `<div><div class="spread" style="margin-bottom:10px"><b class="tt">Inscripcions (${enrolled.length})</b>
      ${admin&&t.status==='inscripcio'?`<button class="btn sm" data-act="kiosk">${IC.tablet}Mode inscripció</button>`:''}</div>
    <div class="plist">${enrolled.map(p=>`<div class="prow"><span class="badge ${p.type}">${p.type==='prof'?'PROF':'ALUM'}</span>
      <span class="nm">${esc(p.name)}<small>${esc(p.group||'')}</small></span>
      ${canRm?`<button class="rmbtn" data-act="unenrol" data-id="${p.id}" aria-label="Treure">✕</button>`:''}

function modal(html, mount){

// Confirmació lliscant per a accions destructives
function slideConfirm(title, msg, label, onOk){
  const d = modal(`<h3 class="tt">${esc(title)}</h3><p class="muted">${msg}</p>
    <div class="slide"><span class="tt">${esc(label)}</span><div class="knob">›</div></div>
    <div class="acts"><button class="btn" data-x>Cancel·lar</button></div>`, d=>{
      d.querySelector('[data-x]').onclick=()=>d.remove();
      const tr=d.querySelector('.slide'), k=d.querySelector('.knob'); let x0=null, max=0, x=0;
      k.addEventListener('pointerdown',e=>{ x0=e.clientX-x; max=tr.clientWidth-k.offsetWidth-8; k.setPointerCapture(e.pointerId); k.style.transition='none'; });
      k.addEventListener('pointermove',e=>{ if(x0==null) return; x=Math.max(0,Math.min(max,e.clientX-x0)); k.style.transform=`translateX(${x}px)`; });
      const up=()=>{ if(x0==null) return; x0=null; if(x>=max*0.92){ d.remove(); onOk(); } else { x=0; k.style.transition='transform .2s'; k.style.transform='translateX(0)'; } };
      k.addEventListener('pointerup',up); k.addEventListener('pointercancel',up);
  });
}

/* ---------- 7. PROJECCIÓ I MODE INSCRIPCIÓ ---------- */
let fsMode='ron';
function project(){
  const tid=ui.tid; if(!T(tid)) return;
  const L=$('#layer'); const d=document.createElement('div'); d.className='fs'; L.appendChild(d);
  const draw=()=>{ const t=T(tid); if(!t){ d.remove(); return; }
    const ri = Math.min(ui.round, t.rounds.length-1), r=t.rounds[ri]||[];
    let n=0, body='';
    if(fsMode==='ron') body = `<div class="fsg">${r.map(g=>{ if(g.b==null) return `<div class="fsgame"><span class="t">–</span><span style="grid-column:2/5">${esc(P(g.w).name)} <span class="vs">descansa</span></span></div>`; n++;
      const rs = g.res ? g.res.replace('-',' – ') : 'vs';
      return `<div class="fsgame"><span class="t">${n}</span><span>♔ ${esc(P(g.w).name)}</span><span class="vs">${rs}</span><span>♚ ${esc(P(g.b).name)}</span></div>`; }).join('')}</div>`;
    else { const st=standings(t); body = `<table class="st"><thead><tr><th>#</th><th>Participant</th><th style="text-align:right">Punts</th></tr></thead><tbody>${st.map((x,i)=>`<tr><td class="pos">${i+1}</td><td><b>${esc(P(x.id).name)}</b></td><td class="n pts">${fmt(x.pts)}</td></tr>`).join('')}</tbody></table>`; }
    d.innerHTML = `<div class="fsbar"><h2 class="tt" style="flex:1">${esc(t.name)} ${fsMode==='ron'?'· Ronda '+(ri+1):''}</h2>
      <button class="btn ${fsMode==='ron'?'on':''}" data-m="ron">Ronda</button><button class="btn ${fsMode==='cla'?'on':''}" data-m="cla">Classificació</button><button class="btn" data-m="x">✕ Sortir</button></div>${body}`;
    d.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ if(b.dataset.m==='x'){ try{document.exitFullscreen&&document.fullscreenElement&&document.exitFullscreen();}catch(e){} d.remove(); return; } fsMode=b.dataset.m; draw(); });
  };
  window._fsRedraw=()=>{ if(d.isConnected) draw(); else window._fsRedraw=null; };
  draw(); try{ d.requestFullscreen && d.requestFullscreen(); }catch(e){}
}
function kiosk(){
  const tid=ui.tid, t=T(tid); const L=$('#layer'); const d=document.createElement('div'); d.className='fs'; L.appendChild(d);
  d.innerHTML = `<div class="fsbar"><span style="flex:1"></span><button class="btn" data-x>✕ Sortir</button></div>
   <div class="kiosk"><div style="font-size:4rem">♞</div><h2 class="tt">Apunta't!</h2><p style="font-size:1.2rem;color:#CFE0EE">${esc(t.name)}</p>
   <input type="text" id="kN" placeholder="Nom i cognom" autocomplete="off"><input type="text" id="kG" placeholder="Grup (p. ex. 1r MEF)" autocomplete="off" style="margin-top:10px">
   <button class="btn ok" id="kOk">Inscriure'm</button><div class="okmsg" id="kMsg"></div>
   <p style="color:#CFE0EE">Inscripcions: <b id="kC">${t.playerIds.length}</b></p></div>`;
  const go=()=>{ const t=T(tid); if(!t) return; const n=d.querySelector('#kN').value.trim(), g=d.querySelector('#kG').value.trim(); if(n.length<3){ d.querySelector('#kMsg').textContent='Escriu el nom complet'; return; }
    let p = S.players.find(x=>norm(x.name)===norm(n));
    if(!p){ p={id:uid(), name:n, type:'alum', group:g}; S.players.push(p); }
    if(t.playerIds.includes(p.id)){ d.querySelector('#kMsg').textContent=`${p.name}, ja hi eres!`; }
    else { t.playerIds.push(p.id); save(); d.querySelector('#kMsg').textContent=`✓ Fet, ${p.name}! Ja tens la inscripció.`; }
    d.querySelector('#kC').textContent=t.playerIds.length; d.querySelector('#kN').value=''; d.querySelector('#kN').focus(); };
  d.querySelector('#kOk').onclick=go; d.querySelector('#kG').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });

  d.querySelector('[data-x]').onclick=()=>{ d.remove(); render(); };
  setTimeout(()=>d.querySelector('#kN').focus(),50);
}

    try{
      const r = await apiGet(); VER = r.ver||0;
      if(r.data) try{ localStorage.setItem('escacs3t_pub', JSON.stringify(r.data)); }catch(e){}
      if(r.data) S = sanitize(r.data);
      else { S = sanitizeSafe(raw) || await fetchPub() || seed(); if(admin && getPin()) save(); }   // full buit: s'hi pugen les dades
      if(admin) try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
      setSync('ok');
    }catch(e){ let cached=null; try{ cached=JSON.parse(localStorage.getItem('escacs3t_pub')||'null'); }catch(_){}
      S = (admin && sanitizeSafe(raw)) || sanitizeSafe(cached) || sanitizeSafe(raw) || await fetchPub() || seed(); setSync('off'); toast('Sense connexió: es mostren les darreres dades guardades'); }
    if(admin && !getPin()){ admin=false; try{localStorage.removeItem(ADM_KEY);}catch(e){} }
    setInterval(poll, POLL_MS);
    document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') poll(); });
  }
  else if(admin){ S = sanitizeSafe(raw) || await fetchPub() || seed(); save(); }
  else     { S = await fetchPub() || sanitizeSafe(raw) || seed(); }   // el públic veu sempre la versió publicada
  applyPrefs(); render();
  if(admin) reqLoad();
})();
</script>
